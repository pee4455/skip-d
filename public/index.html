<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ปิดครัว">
<meta name="description" content="ตัวช่วยงดมื้อเย็น — ติดตามเวลา สตรีค และต้านความหิว">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ปิดครัว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f4; --card:#ffffff; --ink:#111113; --ink2:#3c3c43; --muted:#8a8a8f; --line:#e4e4e8; --fill:#efeff2;
  --accent:#ff5a1f; --accent-2:#ff8a5c; --accent-soft:#fff0ea; --on-accent:#ffffff;
  --light:#ffb595; --miss:#c9c9ce;
  --nav:rgba(255,255,255,.82);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --ink2:#d1d1d6; --muted:#8e8e93; --line:#2c2c2e; --fill:#2c2c2e;
    --accent:#ff6a33; --accent-2:#ff8f63; --accent-soft:#3a1d12; --on-accent:#ffffff;
    --light:#8a4a30; --miss:#48484a;
    --nav:rgba(18,18,20,.78);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#f5f5f7; --ink2:#d1d1d6; --muted:#8e8e93; --line:#2c2c2e; --fill:#2c2c2e;
  --accent:#ff6a33; --accent-2:#ff8f63; --accent-soft:#3a1d12; --on-accent:#ffffff;
  --light:#8a4a30; --miss:#48484a;
  --nav:rgba(18,18,20,.78);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","IBM Plex Sans Thai",system-ui,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none; touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:700}

/* compact nav that fades in on scroll */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(var(--sat) + 10px) 16px 10px;text-align:center;
  font-weight:600;font-size:16px;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line);opacity:0;pointer-events:none;transition:opacity .2s}
.nav.show{opacity:1}

main{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 20px) 16px calc(var(--sab) + 96px)}
.tab[hidden]{display:none}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
h1.large{font-size:32px;line-height:1.15;font-weight:700;margin:2px 0 18px;letter-spacing:-.01em}
.section{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 8px}
.section h2{font-size:20px;font-weight:700;margin:0}
.section .aside{font-size:14px;color:var(--muted)}
.card{background:var(--card);border-radius:16px;padding:16px}
.muted{color:var(--muted)}
.label{font-size:13px;color:var(--muted);font-weight:500}

/* hero timer */
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--fill);color:var(--ink2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.live{background:var(--accent-soft);color:var(--accent)}
.pill.live .dot{background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.bignum{font-size:56px;line-height:1.05;margin:2px 0 16px}
.bar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .6s}
.bar-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.bar-meta b{color:var(--ink);font-weight:600}

.cta{width:100%;margin-top:12px;height:54px;border-radius:14px;background:var(--ink);color:var(--card);
  display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:17px;transition:transform .1s,opacity .1s}
.cta:active{transform:scale(.98);opacity:.85}

/* segmented check-in */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--fill);border-radius:12px;padding:4px}
.seg button{height:44px;border-radius:9px;font-size:15px;font-weight:600;color:var(--ink2);transition:background .15s,color .15s}
.seg button.sel{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.sel[data-s="ok"]{background:var(--accent);color:var(--on-accent)}
.seg.locked button{opacity:.4;pointer-events:none}
.hint{font-size:13px;color:var(--muted);margin-top:10px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px}
.week .wd{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px}
.dotday{width:34px;height:34px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;
  background:var(--fill);color:var(--muted)}
.dotday.ok{background:var(--accent);color:var(--on-accent)}
.dotday.light{background:var(--light);color:#fff}
.dotday.miss{background:transparent;border:1.5px solid var(--miss);color:var(--muted)}
.dotday.today{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.dotday svg{width:16px;height:16px;stroke-width:2.6}

/* 3-up stats */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 0}
.stats3>div{padding:0 14px}
.stats3>div+div{border-left:.5px solid var(--line)}
.stats3 .v{font-size:26px;line-height:1.2;margin-top:2px}
.stats3 .u{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}

/* progress tab */
.seg-small{display:inline-grid;grid-auto-flow:column;gap:2px;background:var(--fill);border-radius:9px;padding:2px}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:10px;font-family:-apple-system,"Inter",sans-serif}
.chart .bar-ok{fill:var(--accent)}
.chart .bar-light{fill:var(--light)}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-size:17px;font-weight:600}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill)}
.icon-btn:active{opacity:.6}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;text-align:center}
.cal .wd{font-size:12px;color:var(--muted);font-weight:500;padding-bottom:4px}
.cal .dotday{width:36px;height:36px}
.cal .dotday.future{opacity:.35}
.cal .blank{height:36px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.list{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:64px;right:0;border-top:.5px solid var(--line)}
.row .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--fill);color:var(--muted)}
.row .ic.ok{background:var(--accent);color:var(--on-accent)}
.row .ic.light{background:var(--light);color:#fff}
.row .ic svg{width:18px;height:18px;stroke-width:2.2}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px}
.row .t span{font-size:13px;color:var(--muted)}
.row .r{font-size:15px;font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}

/* profile */
.profile{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-size:26px;font-weight:700;flex:none}
.profile b{font-size:22px;font-weight:700;display:block;line-height:1.2}
.level{font-size:14px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;text-align:center}
.medal{width:56px;height:56px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;
  background:var(--fill);color:var(--muted);font-weight:800;font-size:18px;position:relative}
.medal svg{width:24px;height:24px}
.medal.got{background:linear-gradient(145deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 4px 12px rgba(255,90,31,.28)}
.badges .n{font-size:11px;line-height:1.3;color:var(--ink2)}
.badges .locked .n{color:var(--muted)}

.form .row{min-height:50px;padding:0 16px}
.form .row+.row::before{left:16px}
.form label{flex:1;font-size:16px}
.form input{border:0;background:transparent;color:var(--muted);font:inherit;font-size:16px;text-align:right;min-width:0;width:50%;padding:12px 0;outline:none}
.form input:focus{color:var(--accent)}
.danger{width:100%;height:50px;color:#ff3b30;font-weight:500;background:var(--card);border-radius:16px;margin-top:12px}
.footnote{font-size:13px;color:var(--muted);margin:14px 4px 0;line-height:1.55}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  padding:6px 8px calc(var(--sab) + 6px);background:var(--nav);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.tabbar button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 0}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--accent)}

/* SOS full screen */
.sos{position:fixed;inset:0;z-index:50;background:#0c0c0e;color:#f5f5f7;display:none;flex-direction:column;
  padding:calc(var(--sat) + 8px) 20px calc(var(--sab) + 16px);overflow:auto}
.sos.open{display:flex;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(16px)}}
.sos-top{display:flex;align-items:center;justify-content:space-between;height:44px}
.sos-top .ttl{font-weight:600}
.sos .icon-btn{background:#232326;color:#f5f5f7}
.breath{position:relative;width:min(72vw,300px);aspect-ratio:1;margin:12px auto 6px;display:grid;place-items:center}
.breath .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,106,51,.28),rgba(255,106,51,.06) 70%);
  border:1px solid rgba(255,106,51,.45);transform:scale(.72)}
.breath.go .ring{animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%{transform:scale(.72)}40%{transform:scale(1)}100%{transform:scale(.72)}}
.breath .in{position:relative;text-align:center}
.breath .clock{font-size:64px;line-height:1}
.breath .cue{font-size:15px;color:#ff8f63;margin-top:6px;font-weight:500}
.sos .sub{text-align:center;color:#a1a1a6;font-size:14px;margin:4px 0 18px}
.mission{background:#1c1c1f;border-radius:16px;padding:16px}
.mission .label{color:#8e8e93}
.mission p{margin:6px 0 14px;font-size:17px;font-weight:500;line-height:1.4}
.mission .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mission .btns button{height:44px;border-radius:12px;background:#2c2c2f;font-weight:600;font-size:15px}
.mission .btns button.done{background:#f5f5f7;color:#0c0c0e}
.mission .btns button:disabled{opacity:.5}
.sos .spacer{flex:1;min-height:20px}
.finish{height:58px;border-radius:29px;background:var(--accent);color:#fff;font-weight:700;font-size:17px;width:100%}
.finish:active{transform:scale(.98)}
.run{display:flex;flex-direction:column;flex:1}
.summary{display:none;flex:1;flex-direction:column;align-items:center;text-align:center;padding-top:10vh}
.summary .ok{width:84px;height:84px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-bottom:18px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.summary .ok svg{width:40px;height:40px;stroke:#fff;stroke-width:3}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.summary h2{font-size:26px;margin:0 0 6px}
.summary .stats3{width:100%;margin:26px 0;background:#1c1c1f;border-radius:16px}
.summary .stats3>div+div{border-color:#333}
.summary .stats3 .label{color:#8e8e93}
.sos.done .run{display:none}
.sos.done .summary{display:flex}

/* toast */
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:max-content;top:calc(var(--sat) + 10px);z-index:90;transform:translateY(-160%);
  background:var(--card);color:var(--ink);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;
  box-shadow:0 8px 30px rgba(0,0,0,.16);display:flex;gap:8px;align-items:center;transition:transform .35s cubic-bezier(.2,1,.3,1);max-width:calc(100% - 32px)}
.toast.show{transform:translateY(0)}
.toast svg{width:18px;height:18px;color:var(--accent);stroke-width:2.4}

/* header with language switch */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.head>div{min-width:0}
.lang-btn{margin-top:2px;height:32px;padding:0 12px;border-radius:99px;background:var(--card);font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink2);display:flex;align-items:center;gap:6px;flex:none}
.lang-btn svg{width:16px;height:16px;stroke-width:2}
.lang-btn:active{opacity:.6}
.seg-mini{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--fill);border-radius:9px;padding:2px;flex:none}
.seg-mini button{height:30px;min-width:64px;padding:0 10px;border-radius:7px;font-size:14px;font-weight:600;color:var(--muted)}
.seg-mini button.sel{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
html[lang="en"] .stats3 .u{margin-left:4px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></symbol>

  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c.8 3.5 5.5 5.6 5.5 11a5.5 5.5 0 0 1-11 0c0-2.6 1.4-4.3 2.6-5.3.1 1.7.9 2.8 2 3.1-.3-3 .2-5.9.9-8.8z"/></symbol>
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 9h-3.2a1.8 1.8 0 0 0 0 3.6h1.4a1.8 1.8 0 0 1 0 3.6H9.5M12 7.5V9M12 16.2v1.3"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C5 11 11 5 19.5 4.5 19 13 13 19 5 19zM5 19l7.5-7.5"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></symbol>

</svg>

<header class="nav" id="nav"><span id="navTitle"></span></header>

<main>
  <!-- ============ HOME ============ -->
  <section class="tab" id="tab-home" data-title="tabToday">
    <div class="head">
      <div>
        <div class="eyebrow" id="homeDate"></div>
        <h1 class="large" id="homeTitle"></h1>
      </div>
      <button class="lang-btn" id="langBtn" aria-label="Language / ภาษา"><svg class="i"><use href="#i-globe"/></svg><span id="langBtnText">EN</span></button>
    </div>

    <div class="card">
      <div class="hero-top">
        <span class="pill" id="phasePill"><span class="dot"></span><span id="phaseText"></span></span>
        <span class="label" id="phaseRange"></span>
      </div>
      <div class="label" id="heroLabel"></div>
      <div class="bignum num" id="heroTime">0:00:00</div>
      <div class="bar"><i id="heroBar"></i></div>
      <div class="bar-meta"><span id="heroStart"></span><span id="heroRemain"></span><span id="heroEnd"></span></div>
    </div>

    <button class="cta" id="sosBtn"><svg class="i"><use href="#i-shield"/></svg><span data-i18n="sosCta"></span></button>

    <div class="section"><h2 id="ciTitle"></h2><span class="aside" id="ciDate"></span></div>
    <div class="card">
      <div class="seg" id="seg">
        <button data-s="ok" data-i18n="stOk"></button>
        <button data-s="light" data-i18n="stLight"></button>
        <button data-s="miss" data-i18n="stMiss"></button>
      </div>
      <div class="hint" id="ciNote"></div>
    </div>

    <div class="section"><h2 data-i18n="thisWeek"></h2><span class="aside" id="weekCount"></span></div>
    <div class="card week" id="week"></div>

    <div class="card stats3" style="margin-top:12px">
      <div><div class="label" data-i18n="streak"></div><div class="v num" id="stStreak"></div></div>
      <div><div class="label" data-i18n="saved"></div><div class="v num" id="stSaved"></div></div>
      <div><div class="label" data-i18n="resisted"></div><div class="v num" id="stFought"></div></div>
    </div>
  </section>

  <!-- ============ PROGRESS ============ -->
  <section class="tab" id="tab-progress" data-title="tabProgress" hidden>
    <div class="eyebrow" data-i18n="overview"></div>
    <h1 class="large" data-i18n="tabProgress"></h1>

function detectLang(){ try{ return (navigator.language||'').toLowerCase().startsWith('th') ? 'th' : 'en'; }catch(e){ return 'th'; } }
function blank(){ return { settings:{...DEFAULTS, lang:detectLang()}, log:{}, xp:0, challenges:0, cravings:0, best:0, badges:[], sessions:[] }; }
function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    if(r && typeof r==='object'){
      const b=blank();
      const settings = {...DEFAULTS, ...(r.settings||{})};
      if(!settings.lang) settings.lang = 'th';   // existing users have been using Thai
      return {...b, ...r, settings, sessions:r.sessions||[]};
    }
  }catch(e){}
  return blank();
}

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const atTime = (base,hhmm) => { const [h,m]=hhmm.split(':').map(Number); const d=new Date(base); d.setHours(h,m,0,0); return d; };

function hms(ms){ const s=Math.max(0,Math.floor(ms/1000)); return `${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`; }
function ms(msv){ const s=Math.max(0,Math.floor(msv/1000)); return `${Math.floor(s/60)}:${pad(s%60)}`; }
function hrsMin(msv){ const m=Math.max(0,Math.round(msv/60000)); const h=Math.floor(m/60), mm=m%60; return h ? t('hm',{h,m:mm}) : t('mOnly',{m:mm}); }
function fastHours(){ const [ch,cm]=S.settings.cutoff.split(':').map(Number), [bh,bm]=S.settings.breakfast.split(':').map(Number);
  const mins=((bh*60+bm)+1440-(ch*60+cm))%1440; return t('hours',{n:Math.round(mins/6)/10}); }
const unit = (n,u) => `${n}<span class="u">${t(u)}</span>`;

function nightKey(now=new Date()){ return keyOf(now < atTime(now,S.settings.breakfast) ? addDays(now,-1) : now); }
function fastingState(now=new Date()){
  const {cutoff,breakfast} = S.settings;
  const cut = atTime(now,cutoff), brk = atTime(now,breakfast);
  if(now < brk) return { fasting:true, start:atTime(addDays(now,-1),cutoff), end:brk };
  if(now >= cut) return { fasting:true, start:cut, end:atTime(addDays(now,1),breakfast) };
  return { fasting:false, since:brk, start:cut, end:atTime(addDays(now,1),breakfast) };
}
function countStatus(s){ return Object.values(S.log).filter(v=>v===s).length; }
const nightSaving = s => s==='ok' ? Number(S.settings.cost||0) : s==='light' ? Number(S.settings.cost||0)/2 : 0;
function saved(){ return Object.values(S.log).reduce((a,s)=>a+nightSaving(s),0); }
function streak(){
  let d = fromKey(nightKey());
  if(!S.log[keyOf(d)]) d = addDays(d,-1);
  let n=0; while(S.log[keyOf(d)]==='ok'||S.log[keyOf(d)]==='light'){ n++; d=addDays(d,-1); }
  return n;
}
function levelInfo(xp){ let Lv=1; while(xp >= 50*(Lv+1)*Lv) Lv++; const base=50*Lv*(Lv-1), next=50*(Lv+1)*Lv; return {L:Lv,cur:xp-base,need:next-base}; }
const levelName = Lv => L().levels[Math.min(Lv,L().levels.length)-1];

/* ---------- feedback ---------- */
let toastT;
function toast(msg){ $('toastText').textContent=msg; const el=$('toast'); el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2400); }
function gainXP(n){
  const before = levelInfo(S.xp).L;
  S.xp = Math.max(0, S.xp+n);
  const after = levelInfo(S.xp).L;
  if(after>before) setTimeout(()=>toast(t('levelUp',{name:levelName(after), l:after})), 2600);
}
function checkBadges(){
  S.best = Math.max(S.best||0, streak());
  let delay = 0;
  for(const b of BADGES){
    if(!S.badges.includes(b.id) && b.test(S)){
      S.badges.push(b.id);
      delay += 2600; setTimeout(()=>toast(t('badgeGot',{name:L().badges[b.id]})), delay);
    }
  }
}

/* ---------- check-in ---------- */
function checkinTarget(){
  const now=new Date(), fs=fastingState(now);
  if(!fs.fasting){
    const last = keyOf(addDays(now,-1));
    if(!S.log[last]) return { key:last, title:'ciLastNight', open:true };
    return { key:keyOf(now), title:'ciTonight', open:false };
  }
  return { key:nightKey(now), title:'ciTonight', open:true };
}
function setStatus(key,status){
  const old = S.log[key];
  if(old) gainXP(-XP_VAL[old]);
  if(status){ S.log[key]=status; gainXP(XP_VAL[status]); } else delete S.log[key];
  checkBadges(); save(); renderAll();
}

/* ---------- static text ---------- */
function applyStatic(){
  document.documentElement.lang = lang;
  document.title = t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $('navTitle').textContent = t($('tab-'+tab).dataset.title);
  $('langBtnText').textContent = lang==='th' ? 'EN' : 'ไทย';
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('sel', b.dataset.lang===lang));
}
function setLang(l){
  if(l===lang) return;
  lang = l; S.settings.lang = l; save();
  applyStatic(); renderAll();
  if($('sos').classList.contains('open')){ showMission(); if(sos) tickSOS(); }
  toast(t('langSwitched'));
}

/* ---------- render: home ---------- */
function renderHome(){
  const now=new Date();
  $('homeDate').textContent = L().homeDate(now, L());
  $('homeTitle').textContent = S.settings.name ? t('hello',{name:S.settings.name}) : t('tabToday');
  $('phaseRange').textContent = `${S.settings.cutoff} – ${S.settings.breakfast} · ${fastHours()}`;
  renderTimer();

  const tg=checkinTarget(), cur=S.log[tg.key];
  $('ciTitle').textContent = t(tg.title);
  $('ciDate').textContent = `${L().daysShort[fromKey(tg.key).getDay()]} ${fmtDate(fromKey(tg.key))}`;
  $('seg').classList.toggle('locked', !tg.open);
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('sel', b.dataset.s===cur));
  $('ciNote').textContent = !tg.open ? t('ciLocked',{t:S.settings.cutoff})
    : cur ? t('ciSaved',{xp:XP_VAL[cur]}) : t('ciHint');

  const tonight=fromKey(nightKey(now)), mon=mondayOf(tonight);
  let html='', cnt=0;
  for(let i=0;i<7;i++){
    const d=addDays(mon,i), k=keyOf(d), s=S.log[k];
    if(s==='ok'||s==='light') cnt++;
    const inner = s==='ok'||s==='light' ? icon('check') : d.getDate();
    html += `<div><div class="wd">${L().weekHead[i]}</div><div class="dotday ${s||''} ${k===keyOf(tonight)?'today':''}">${inner}</div></div>`;
  }
  $('week').innerHTML = html;
  $('weekCount').textContent = t('weekCount',{n:cnt});

  $('stStreak').innerHTML = unit(streak(),'nights');
  $('stSaved').textContent = baht(saved());
  $('stFought').innerHTML = unit(S.cravings,'times');
}

function renderTimer(){
  const now=new Date(), fs=fastingState(now);
  const pill=$('phasePill');
  if(fs.fasting){
    const total=fs.end-fs.start, done=now-fs.start;
    pill.classList.add('live'); $('phaseText').textContent=t('fasting');
    $('heroLabel').textContent=t('fastingFor');
    $('heroTime').textContent=hms(done);
    $('heroBar').style.width=Math.min(100,done/total*100)+'%';
    $('heroStart').textContent=S.settings.cutoff;
    $('heroEnd').textContent=S.settings.breakfast;
    $('heroRemain').innerHTML=t('left',{t:hrsMin(fs.end-now)});
  }else{
    const total=fs.start-fs.since, left=fs.start-now;
    pill.classList.remove('live'); $('phaseText').textContent=t('eating');
    $('heroLabel').textContent=t('closesIn');
    $('heroTime').textContent=hms(left);
    $('heroBar').style.width=Math.min(100,(1-left/total)*100)+'%';
    $('heroStart').textContent=S.settings.breakfast;
    $('heroEnd').textContent=S.settings.cutoff;
    $('heroRemain').textContent = left<3600000 ? t('lastMealSoon') : t('eatLunch');
  }
}

/* ---------- render: progress ---------- */
let calMonth = (()=>{ const d=fromKey(nightKey()); return new Date(d.getFullYear(), d.getMonth(), 1); })();

function renderProgress(){
  const tn=fromKey(nightKey()), y=tn.getFullYear(), m=tn.getMonth();
  const entries = Object.entries(S.log).filter(([k])=>{ const d=fromKey(k); return d.getFullYear()===y && d.getMonth()===m; });
  const good = entries.filter(([,s])=>s==='ok'||s==='light').length;
  $('pmNights').innerHTML = unit(entries.filter(([,s])=>s==='ok').length,'nights');
  $('pmRate').textContent = entries.length ? Math.round(good/entries.length*100)+'%' : '–';
  $('pmSaved').textContent = baht(entries.reduce((a,[,s])=>a+nightSaving(s),0));
  renderChart(tn); renderCal(); renderFeed();
}

function renderChart(tonight){
  const W=320, H=150, padL=18, padB=22, padT=8, weeks=8, slot=(W-padL)/weeks, bw=slot*.5;
  const mon=mondayOf(tonight);
  const y = v => padT + (H-padT-padB)*(1-v/7);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('chartAria')}">`;
  for(const v of [0,3.5,7]){ svg += `<line class="grid" x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"${v?' stroke-dasharray="2 3"':''}/>`; }
  svg += `<text x="0" y="${y(7)+3}">7</text><text x="0" y="${y(0)+3}">0</text>`;
  for(let w=0; w<weeks; w++){
    const ws=addDays(mon,-7*(weeks-1-w)); let ok=0, li=0;
    for(let i=0;i<7;i++){ const s=S.log[keyOf(addDays(ws,i))]; if(s==='ok') ok++; else if(s==='light') li++; }
    const x = padL + w*slot + (slot-bw)/2;
    if(ok) svg += `<rect class="bar-ok" x="${x}" y="${y(ok)}" width="${bw}" height="${y(0)-y(ok)}" rx="3"><title>${fmtDate(ws)}: ${ok}</title></rect>`;
    if(li) svg += `<rect class="bar-light" x="${x}" y="${y(ok+li)}" width="${bw}" height="${y(ok)-y(ok+li)}" rx="3"/>`;
    if(!ok && !li) svg += `<rect fill="var(--fill)" x="${x}" y="${y(0)-3}" width="${bw}" height="3" rx="1.5"/>`;
    if(w%2===1 || w===weeks-1) svg += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${w===weeks-1?t('thisWk'):fmtDate(ws)}</text>`;
  }
  $('chart').innerHTML = svg + '</svg>';
}

function renderCal(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  $('calTitle').textContent = L().monthYear(m,y,L());
  const tonight=fromKey(nightKey()), first=new Date(y,m,1,12), days=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7;
  const cal=$('cal'); cal.innerHTML = L().weekHead.map(d=>`<div class="wd">${d}</div>`).join('') + '<div class="blank"></div>'.repeat(lead);
  for(let i=1;i<=days;i++){
    const d=new Date(y,m,i,12), k=keyOf(d), s=S.log[k], future=d>tonight;
    const b=document.createElement('div');
    b.innerHTML = `<button class="dotday ${s||''} ${k===keyOf(tonight)?'today':''} ${future?'future':''}" ${future?'disabled':''} aria-label="${fmtDate(d)}">${i}</button>`;
    if(!future) b.firstChild.onclick = ()=>{
      const order=[undefined,'ok','light','miss'];
      setStatus(k, order[(order.indexOf(S.log[k])+1)%order.length]);
    };
    cal.appendChild(b);
  }
  const nextMonth = new Date(y,m+1,1);
  $('calNext').disabled = nextMonth > tonight; $('calNext').style.opacity = nextMonth > tonight ? .3 : 1;
}

function renderFeed(){
  const keys = Object.keys(S.log).sort().reverse().slice(0,12);
  if(!keys.length){ $('feed').innerHTML = `<div class="empty">${t('empty')}</div>`; return; }
  const T = { ok:'feedOk', light:'feedLight', miss:'feedMiss' };
  const I = { ok:'check', light:'cup', miss:'x' };
  $('feed').innerHTML = keys.map(k=>{
    const s=S.log[k], d=fromKey(k);
    const fights = S.sessions.filter(x=>nightKey(new Date(x.t))===k).length;
    const sub = `${L().daysShort[d.getDay()]} ${fmtDate(d)}` + (s==='ok'?` · ${fastHours()}`:'') + (fights?` · ${t('feedFights',{n:fights})}`:'');
    const r = nightSaving(s) ? baht(nightSaving(s)) : '';
    return `<div class="row"><div class="ic ${s}">${icon(I[s])}</div><div class="t"><b>${t(T[s])}</b><span>${sub}</span></div><div class="r num">${r}</div></div>`;
  }).join('');
}

/* ---------- render: profile ---------- */
function renderProfile(){
  const li=levelInfo(S.xp);
  $('avatar').textContent = (S.settings.name||'?').trim().charAt(0).toUpperCase() || '?';
  $('pName').textContent = S.settings.name || t('user');
  $('pLevel').textContent = `Lv.${li.L} · ${levelName(li.L)}`;
  $('xpLabel').textContent = `${S.xp.toLocaleString(L().locale)} XP`;
  $('xpNext').textContent = t('xpNext',{n:li.need-li.cur, l:li.L+1});
  $('xpBar').style.width = (li.cur/li.need*100)+'%';
  $('pTotal').textContent = countStatus('ok');
  $('pBest').textContent = S.best||0;
  $('pMissions').textContent = S.challenges;
  const got = BADGES.filter(b=>S.badges.includes(b.id)).length;
  $('badgeCount').textContent = `${got}/${BADGES.length}`;
  $('badges').innerHTML = BADGES.map(b=>{
    const has=S.badges.includes(b.id);
    const inner = b.icon ? icon(b.icon) : b.txt;
    return `<div class="${has?'':'locked'}"><div class="medal ${has?'got':''}">${inner}</div><div class="n">${L().badges[b.id]}</div></div>`;
  }).join('');
  if(document.activeElement?.tagName!=='INPUT'){
    $('fName').value=S.settings.name; $('fCut').value=S.settings.cutoff; $('fBreak').value=S.settings.breakfast; $('fCost').value=S.settings.cost;
  }
}

function renderAll(){ renderHome(); renderProgress(); renderProfile(); }

/* ---------- tabs & nav ---------- */
let tab='home';
function showTab(name){
  tab=name;
  document.querySelectorAll('.tab').forEach(s=>s.hidden = s.id!=='tab-'+name);
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
  $('navTitle').textContent = t($('tab-'+name).dataset.title);
  window.scrollTo(0,0); onScroll();
}
document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function onScroll(){ $('nav').classList.toggle('show', window.scrollY>48); }
window.addEventListener('scroll', onScroll, {passive:true});

/* ---------- events ---------- */
$('langBtn').onclick = ()=>setLang(lang==='th' ? 'en' : 'th');
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{
  const tg=checkinTarget(); if(!tg.open) return;
  const s=b.dataset.s; if(S.log[tg.key]===s) return;
  setStatus(tg.key,s);
  toast(s==='ok' ? t('toastOk',{xp:XP_VAL.ok}) : s==='light' ? t('toastLight',{xp:XP_VAL.light}) : t('toastMiss'));
});
$('calPrev').onclick=()=>{ calMonth=new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); renderCal(); };
$('calNext').onclick=()=>{ calMonth=new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); renderCal(); };

function bindSetting(id, apply){
  $(id).addEventListener('change', ()=>{ if(apply($(id).value)!==false){ save(); renderAll(); toast(t('settingsSaved')); } else renderProfile(); });
}
bindSetting('fName', v=>{ S.settings.name=v.trim(); });
bindSetting('fCut', v=>{ if(!v||v<=S.settings.breakfast){ toast(t('errCut')); return false; } S.settings.cutoff=v; });
bindSetting('fBreak', v=>{ if(!v||v>=S.settings.cutoff){ toast(t('errBreak')); return false; } S.settings.breakfast=v; });
bindSetting('fCost', v=>{ S.settings.cost=Math.max(0,Number(v)||0); });
$('resetAll').onclick=()=>{ if(confirm(t('resetConfirm'))){ const l=lang; S=blank(); S.settings.lang=l; save(); renderAll(); toast(t('resetDone')); } };

/* ---------- SOS ---------- */
let sos = null, sosTimer = null, missionIdx = -1;
function showMission(){ $('mText').textContent = L().missionList[missionIdx] || ''; }
function newMission(){
  const n = L().missionList.length; let i;
  do{ i=Math.floor(Math.random()*n); }while(n>1 && i===missionIdx);
  missionIdx=i; showMission(); $('mDone').disabled=false; $('mDone').textContent=t('mDone');
}
function tickSOS(){
  const el=Date.now()-sos.start, left=WAVE_MS-el;
  $('sosClock').textContent = left>0 ? ms(left+999) : ms(el);
  $('sosCue').textContent = (el/1000)%10 < 4 ? t('breatheIn') : t('breatheOut');
  $('sosSub').textContent = left>0 ? t('sosSub') : t('sosSubDone');
}
$('sosBtn').onclick = ()=>{
  sos = { start:Date.now(), missions:0, xp:0 };
  newMission();
  const br=$('breath'); br.classList.remove('go'); void br.offsetWidth; br.classList.add('go');
  $('sos').classList.remove('done'); $('sos').classList.add('open');
  document.body.style.overflow='hidden';
  tickSOS(); clearInterval(sosTimer); sosTimer=setInterval(tickSOS,250);
};
function closeSOS(){ clearInterval(sosTimer); $('sos').classList.remove('open'); document.body.style.overflow=''; renderAll(); }
$('sosClose').onclick = closeSOS;
$('mShuffle').onclick = newMission;
$('mDone').onclick = ()=>{
  S.challenges++; gainXP(10); sos.missions++; sos.xp+=10; checkBadges(); save();
  $('mDone').disabled=true; $('mDone').textContent=t('mDoneOk');
  setTimeout(newMission, 900);
};
$('sosFinish').onclick = ()=>{
  clearInterval(sosTimer);
  const dur = Date.now()-sos.start;
  S.cravings++; S.sessions.push({ t:Date.now(), d:Math.round(dur/1000) }); if(S.sessions.length>300) S.sessions.shift();
  gainXP(10); sos.xp+=10; checkBadges(); save();
  $('sumTime').textContent = ms(dur);
  $('sumMissions').textContent = sos.missions;
  $('sumXP').textContent = '+'+sos.xp;
  $('sumMsg').textContent = t('sumMsg',{n:S.cravings});
  $('sos').classList.add('done');
};
$('sosDone').onclick = closeSOS;

/* ---------- boot ---------- */
applyStatic(); checkBadges(); save(); renderAll(); showTab('home');
setInterval(()=>{ if(tab==='home') renderTimer(); }, 1000);
let lastNight = nightKey();
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ renderAll(); } });
setInterval(()=>{ const n=nightKey(); if(n!==lastNight){ lastNight=n; renderAll(); } }, 60000);
</script>
</body>
