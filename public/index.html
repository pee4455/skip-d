<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ปิดครัว">
<meta name="description" content="ตัวช่วยงดมื้อเย็น — ติดตามเวลา สตรีค และต้านความหิว">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ปิดครัว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f6; --card:#ffffff; --ink:#0f0f12; --ink2:#3a3a40; --muted:#8a8a92; --line:rgba(0,0,0,.07); --fill:#ededf1;
  --accent:#ff5a1f; --accent2:#ff9a62; --grad:linear-gradient(135deg,#ff3d00 0%,#ff6a2b 45%,#ff9a62 100%);
  --accent-soft:#fff0e9; --light:#ffb595; --miss:#c9c9cf;
  --shadow:0 1px 2px rgba(16,16,20,.04),0 12px 32px rgba(16,16,20,.06);
  --nav:rgba(244,244,246,.78); --hero:#121215; --sheet:#ffffff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#131316; --ink:#f5f5f7; --ink2:#d1d1d6; --muted:#8e8e96; --line:rgba(255,255,255,.08); --fill:#232328;
    --accent:#ff6a33; --accent2:#ffa070; --accent-soft:#3a1d12; --light:#8a4a30; --miss:#46464c;
    --shadow:0 0 0 1px rgba(255,255,255,.05);
    --nav:rgba(8,8,10,.72); --hero:#17171b; --sheet:#1c1c1f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#131316; --ink:#f5f5f7; --ink2:#d1d1d6; --muted:#8e8e96; --line:rgba(255,255,255,.08); --fill:#232328;
  --accent:#ff6a33; --accent2:#ffa070; --accent-soft:#3a1d12; --light:#8a4a30; --miss:#46464c;
  --shadow:0 0 0 1px rgba(255,255,255,.05);
  --nav:rgba(8,8,10,.72); --hero:#17171b; --sheet:#1c1c1f;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Inter","IBM Plex Sans Thai",system-ui,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none; touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.03em;font-weight:700}
.press{transition:transform .15s cubic-bezier(.3,1.4,.5,1),opacity .15s}
.press:active{transform:scale(.97);opacity:.9}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(var(--sat) + 10px) 16px 10px;text-align:center;
  font-weight:600;font-size:16px;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line);opacity:0;pointer-events:none;transition:opacity .2s}
.nav.show{opacity:1}

main{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 18px) 16px calc(var(--sab) + 100px)}
.tab[hidden]{display:none}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.head>div{min-width:0}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.01em}
h1.large{font-size:32px;line-height:1.15;font-weight:700;margin:2px 0 18px;letter-spacing:-.02em}
.head-actions{display:flex;gap:8px;margin-top:4px;flex:none}
.chip-btn{height:34px;padding:0 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:6px}
.chip-btn svg{width:16px;height:16px}
.mini-avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;box-shadow:var(--shadow)}

.section{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 10px}
.section h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.section .aside{font-size:13px;color:var(--muted)}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.label{font-size:13px;color:var(--muted);font-weight:500}

/* ===== hero ===== */
.hero{position:relative;overflow:hidden;isolation:isolate;background:var(--hero);color:#fff;border-radius:28px;padding:18px 18px 16px;
  box-shadow:0 20px 50px rgba(255,90,31,.16),0 2px 6px rgba(0,0,0,.1)}
.hero::before{content:"";position:absolute;z-index:-1;right:-120px;top:-140px;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,90,31,.55),rgba(255,90,31,0) 65%);transition:opacity .6s}
.hero::after{content:"";position:absolute;z-index:-1;left:-140px;bottom:-180px;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,154,98,.18),rgba(255,154,98,0) 65%)}
.hero.day::before{opacity:.45}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}
.hero.live .pill{background:rgba(255,90,31,.18);color:#ffb08a}
.hero.live .pill .dot{background:#ff6a33;box-shadow:0 0 0 0 rgba(255,106,51,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(255,106,51,0)}100%{box-shadow:0 0 0 0 rgba(255,106,51,0)}}
.hero-top .range{font-size:13px;color:rgba(255,255,255,.55);font-weight:500}
.ring-wrap{position:relative;width:min(64vw,240px);aspect-ratio:1;margin:10px auto 6px}
.ring-wrap svg{width:100%;height:100%;overflow:visible}
.ring-track{stroke:rgba(255,255,255,.08)}
.ring-arc{filter:drop-shadow(0 0 8px rgba(255,90,31,.55));transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center .lbl{font-size:13px;color:rgba(255,255,255,.6);font-weight:500}
.ring-center .time{font-size:clamp(38px,12vw,48px);line-height:1.05;margin:4px 0 6px;color:#fff}
.ring-center .sub{font-size:13px;color:#ffb08a;font-weight:600}
.hero-metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.hero-metrics>div{display:flex;flex-direction:column;align-items:center;gap:3px}
.hero-metrics svg{width:18px;height:18px;color:#ff8a5c}
.hero-metrics .k{font-size:12px;color:rgba(255,255,255,.5)}
.hero-metrics .v{font-size:16px;color:#fff}

.cta{position:relative;overflow:hidden;width:100%;margin-top:12px;height:56px;border-radius:18px;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:17px;box-shadow:0 12px 28px rgba(255,90,31,.35)}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite 1.5s}
@keyframes shine{0%{left:-80px}25%,100%{left:120%}}

/* segmented with sliding thumb */
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--fill);border-radius:14px;padding:4px}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--card);
  box-shadow:0 2px 8px rgba(0,0,0,.12);opacity:0;transition:transform .45s cubic-bezier(.3,1.35,.5,1),opacity .2s,background .3s}
.seg .thumb.ok{background:var(--grad);box-shadow:0 6px 16px rgba(255,90,31,.35)}
.seg button{position:relative;z-index:1;height:46px;border-radius:10px;font-size:15px;font-weight:600;color:var(--ink2);transition:color .25s}
.seg button.sel{color:var(--ink)}
.seg button.sel[data-s="ok"]{color:#fff}
.seg.locked button{opacity:.4;pointer-events:none}
.hint{font-size:13px;color:var(--muted);margin-top:10px;display:flex;gap:6px;align-items:center}
.hint svg{width:15px;height:15px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px}
.week .wd{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px}
.dotday{width:36px;height:36px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--fill);color:var(--muted)}
.dotday.ok{background:var(--grad);color:#fff;box-shadow:0 4px 10px rgba(255,90,31,.3)}
.dotday.light{background:var(--light);color:#fff}
.dotday.miss{background:transparent;border:1.5px solid var(--miss);color:var(--muted)}
.dotday.today{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.dotday svg{width:16px;height:16px;stroke-width:3}

/* stats */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 0}
.stats3>div{padding:0 14px;min-width:0}
.stats3>div+div{border-left:1px solid var(--line)}
.stats3 .v{font-size:26px;line-height:1.2;margin-top:4px;white-space:nowrap}
.stats3 .u{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px;letter-spacing:0}
.stat-ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:8px}
.stat-ic svg{width:16px;height:16px}

/* charts */
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.chart-head .big{font-size:26px;line-height:1.15;margin-top:2px}
.chart-head .u{font-size:13px;color:var(--muted);font-weight:600;margin-left:5px;letter-spacing:0}
.chart-box{position:relative;height:180px}
.chart-box.sm{height:150px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-size:17px;font-weight:700}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill)}
.icon-btn svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px;text-align:center}
.cal .wd{font-size:12px;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal .dotday.future{opacity:.35}
.cal .blank{height:36px}

/* list */
.list{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:66px;right:0;border-top:1px solid var(--line)}
.row .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--fill);color:var(--muted)}
.row .ic.ok{background:var(--grad);color:#fff}
.row .ic.light{background:var(--light);color:#fff}
.row .ic svg{width:18px;height:18px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px}
.row .t span{font-size:13px;color:var(--muted)}
.row .r{font-size:15px;color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}

/* profile */
.profile-card{display:flex;align-items:center;gap:16px}
.av-wrap{position:relative;width:84px;height:84px;flex:none}
.av-wrap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.av-wrap .avatar{position:absolute;inset:8px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700}
.profile-card b{font-size:22px;font-weight:700;display:block;line-height:1.2}
.level{font-size:14px;color:var(--accent);font-weight:600;margin-top:2px}
.xp{font-size:13px;color:var(--muted);margin-top:2px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;text-align:center}
.medal{position:relative;overflow:hidden;width:58px;height:58px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;
  background:var(--fill);color:var(--muted);font-weight:800;font-size:18px}
.medal svg{width:24px;height:24px}
.medal.got{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(255,90,31,.32)}
.medal.got::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(150deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 45%)}
.badges .n{font-size:11px;line-height:1.3;color:var(--ink2);font-weight:500}
.badges .locked .n{color:var(--muted)}
.form .row{min-height:52px;padding:0 16px}
.form .row+.row::before{left:16px}
.form label{flex:1;font-size:16px}
.form input{border:0;background:transparent;color:var(--muted);font:inherit;font-size:16px;text-align:right;min-width:0;width:50%;padding:12px 0;outline:none}
.form input:focus{color:var(--accent)}
.seg-mini{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--fill);border-radius:10px;padding:2px;flex:none}
.seg-mini button{height:30px;min-width:64px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg-mini button.sel{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.danger{width:100%;height:52px;color:#ff3b30;font-weight:600;background:var(--card);border-radius:16px;margin-top:12px;box-shadow:var(--shadow)}
.footnote{font-size:13px;color:var(--muted);margin:14px 4px 0;line-height:1.55}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  padding:6px 8px calc(var(--sab) + 6px);background:var(--nav);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.tabbar button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tabbar button svg{width:25px;height:25px;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.tabbar button.on{color:var(--accent)}
.tabbar button.on svg{transform:translateY(-1px) scale(1.06)}

/* action sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
.sheet-wrap.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:absolute;left:8px;right:8px;bottom:calc(var(--sab) + 8px);max-width:540px;margin:0 auto}
.sheet-group{background:var(--sheet);border-radius:16px;overflow:hidden;margin-bottom:8px}
.sheet-title{padding:14px 16px;text-align:center;font-size:13px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
.sheet-group button{width:100%;height:56px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:500;color:var(--accent)}
.sheet-group button+button{border-top:1px solid var(--line)}
.sheet-group button svg{width:19px;height:19px}
.sheet-group button.cur{font-weight:700}
.sheet-group button.destructive{color:#ff3b30}
.sheet-cancel{width:100%;height:56px;border-radius:16px;background:var(--sheet);font-size:17px;font-weight:700;color:var(--accent)}

/* SOS */
.sos{position:fixed;inset:0;z-index:50;background:#0a0a0c;color:#f5f5f7;display:none;flex-direction:column;
  padding:calc(var(--sat) + 8px) 20px calc(var(--sab) + 16px);overflow:auto}
.sos::before{content:"";position:fixed;left:50%;top:22%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,90,31,.22),rgba(255,90,31,0) 62%);pointer-events:none}
.sos.open{display:flex}
.sos-top{position:relative;display:flex;align-items:center;justify-content:space-between;height:44px}
.sos-top .ttl{font-weight:600}
.sos .icon-btn{background:rgba(255,255,255,.09);color:#f5f5f7}
.breath{position:relative;width:min(76vw,300px);aspect-ratio:1;margin:14px auto 4px;display:grid;place-items:center}
.breath svg.cd{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.breath .orb{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 50% 40%,rgba(255,138,92,.38),rgba(255,90,31,.08) 70%);
  border:1px solid rgba(255,106,51,.35);transform:scale(.72)}
.breath.go .orb{animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%{transform:scale(.72)}40%{transform:scale(1)}100%{transform:scale(.72)}}
.breath .in{position:relative;text-align:center}
.breath .clock{font-size:64px;line-height:1}
.breath .cue{font-size:15px;color:#ff9a62;margin-top:8px;font-weight:600;display:flex;align-items:center;gap:6px;justify-content:center}
.breath .cue svg{width:16px;height:16px}
.sos .sub{position:relative;text-align:center;color:#a1a1a6;font-size:14px;margin:4px 0 18px}
.mission{position:relative;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:16px}
.mission .label{color:#8e8e93;display:flex;gap:6px;align-items:center}
.mission .label svg{width:15px;height:15px;color:#ff8a5c}
.mission p{margin:8px 0 14px;font-size:17px;font-weight:600;line-height:1.4;min-height:48px}
.mission .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mission .btns button{height:46px;border-radius:14px;background:rgba(255,255,255,.08);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.mission .btns button svg{width:17px;height:17px}
.mission .btns button.done{background:#f5f5f7;color:#0a0a0c}
.mission .btns button:disabled{opacity:.55}
.sos .spacer{flex:1;min-height:20px}
.finish{position:relative;height:58px;border-radius:29px;background:var(--grad);color:#fff;font-weight:700;font-size:17px;width:100%;box-shadow:0 12px 30px rgba(255,90,31,.4)}
.run{position:relative;display:flex;flex-direction:column;flex:1}
.summary{position:relative;display:none;flex:1;flex-direction:column;align-items:center;text-align:center;padding-top:9vh}
.summary .ok{width:92px;height:92px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin-bottom:20px;box-shadow:0 16px 40px rgba(255,90,31,.45)}
.summary .ok svg{width:44px;height:44px;stroke:#fff}
.summary h2{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.summary .stats3{width:100%;margin:26px 0;background:rgba(255,255,255,.06);border-radius:20px}
.summary .stats3>div+div{border-color:rgba(255,255,255,.1)}
.summary .stats3 .label{color:#8e8e93}
.sos.done .run{display:none}
.sos.done .summary{display:flex}

/* toast */
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:max-content;max-width:calc(100% - 32px);top:calc(var(--sat) + 10px);z-index:140;
  transform:translateY(-160%);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;
  box-shadow:0 10px 34px rgba(0,0,0,.18);display:flex;gap:8px;align-items:center;transition:transform .45s cubic-bezier(.2,1.2,.3,1)}
.toast.show{transform:translateY(0)}
.toast svg{width:18px;height:18px;color:var(--accent);stroke-width:2.5}

/* ===== onboarding tour ===== */
.tour{position:fixed;inset:0;z-index:150;display:none;touch-action:none}
.tour.open{display:block}
.shade{position:fixed;inset:0;background:rgba(6,6,10,.72);pointer-events:none}
.spot{position:fixed;left:50%;top:50%;width:0;height:0;border-radius:22px;pointer-events:none;opacity:0}
.spot::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:2px solid rgba(255,138,92,.9);
  box-shadow:0 0 22px rgba(255,90,31,.55);animation:spotPulse 1.6s ease-in-out infinite}
@keyframes spotPulse{50%{inset:-9px;opacity:.35}}
.dlg{position:fixed;left:12px;right:12px;max-width:540px;margin:0 auto;bottom:calc(var(--sab) + 14px)}
.dlg.top{bottom:auto;top:calc(var(--sat) + 100px)}
.mascot{position:absolute;left:0;bottom:calc(100% - 30px);width:112px;height:121px;z-index:2;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.mascot svg{width:100%;height:100%;overflow:visible}
.dlg-box{position:relative;background:linear-gradient(180deg,#1d1d23,#141418);color:#f5f5f7;border-radius:22px;padding:24px 18px 14px;
  border:1.5px solid rgba(255,138,92,.55);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.dlg-name{position:absolute;top:-14px;left:112px;padding:4px 14px;border-radius:99px;background:var(--grad);color:#fff;
  font-weight:700;font-size:14px;box-shadow:0 6px 14px rgba(255,90,31,.4)}
.dlg-text{font-size:16px;line-height:1.65;min-height:78px;white-space:pre-line;padding-right:16px}
.dlg-caret{position:absolute;right:13px;top:26px;color:#ff8a5c;font-size:12px;opacity:0;animation:caret 1s steps(1) infinite}
.dlg-box.ready .dlg-caret{opacity:1}
@keyframes caret{50%{visibility:hidden}}
.dlg-extra:empty{display:none}
.dlg-extra{margin-top:12px}
.dlg-input{display:flex;gap:8px}
.dlg-input input{flex:1;min-width:0;height:46px;border-radius:14px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);
  color:#fff;font:inherit;font-size:16px;padding:0 14px;outline:none}
.dlg-input input:focus{border-color:#ff8a5c}
.dlg-input button,.dlg-choices button{height:46px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;padding:0 18px}
.dlg-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dlg-choices button{padding:0;background:rgba(255,255,255,.08);border:1.5px solid transparent;font-size:15px}
.dlg-choices button.sel{background:var(--grad);border-color:rgba(255,255,255,.25)}
.dlg-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.dlg-skip{font-size:14px;color:#8e8e96;font-weight:600;padding:8px 4px}
.dlg-dots{display:flex;gap:5px;align-items:center}
.dlg-dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.18);transition:width .3s,background .3s}
.dlg-dots i.on{width:18px;background:#ff8a5c}
.dlg-dots i.done{background:rgba(255,138,92,.5)}
.dlg-next{height:40px;padding:0 18px;border-radius:99px;background:var(--grad);color:#fff;font-weight:700;font-size:15px;box-shadow:0 6px 16px rgba(255,90,31,.4)}

/* mascot moods & motion */
.moonie .e-happy,.moonie .e-wink,.moonie .m-open,.moonie .m-o{display:none}
.moonie[data-mood="excited"] .e-open,.moonie[data-mood="wink"] .e-open{display:none}
.moonie[data-mood="excited"] .e-happy,.moonie[data-mood="wink"] .e-wink{display:inline}
.moonie[data-mood="excited"] .m-smile{display:none}
.moonie[data-mood="excited"] .m-open{display:inline}
.moonie[data-mood="think"] .m-smile{display:none}
.moonie[data-mood="think"] .m-o{display:inline}
.moonie.talking .m-smile,.moonie.talking .m-o{display:none}
.moonie.talking .m-open{display:inline;animation:talk .26s ease-in-out infinite}
.moonie .m-open{transform-box:fill-box;transform-origin:50% 0}
@keyframes talk{50%{transform:scaleY(.35)}}
.moonie .e-open{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.moonie .m-body{animation:bob 2.4s ease-in-out infinite}
.moonie .m-shadow{transform-box:fill-box;transform-origin:center;animation:shadow 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes shadow{50%{transform:scaleX(.82);opacity:.7}}
.moonie .m-arm{transform-box:view-box;transform-origin:92px 96px}
.moonie.wave .m-arm{animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.moonie .m-spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.moonie .m-spark.s2{animation-delay:.9s}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.1);opacity:1}}

.help-btn{width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink2)}
.help-btn svg{width:19px;height:19px}
.form .row.link{cursor:pointer;color:var(--accent);font-weight:600}
.form .row.link svg{width:20px;height:20px}

/* ===== rewards: wallet / machine / quests / collection ===== */
.tabbar button{position:relative}
.tab-dot{position:absolute;top:3px;left:calc(50% + 7px);width:10px;height:10px;border-radius:50%;background:#ff3b30;border:2px solid var(--bg)}
.tab-dot[hidden]{display:none}
.wallet{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 0}
.wallet>div{padding:0 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.wallet>div+div{border-left:1px solid var(--line)}
.wallet .wv{font-size:24px;display:flex;align-items:center;gap:6px;line-height:1.2}
.wallet .wv svg{width:20px;height:20px;color:var(--accent)}
.wallet .wv.gold svg{color:#f5a300}
.wallet .wv.star b{color:#8b5cf6;font-size:19px}
.ex-btn{margin-top:4px;font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:4px 9px;align-self:flex-start;white-space:nowrap}
.ex-btn:disabled{opacity:.4}
.machine-card{position:relative;overflow:hidden;isolation:isolate;background:var(--hero);color:#fff;border-radius:28px;padding:16px 16px 16px;margin-top:12px;
  box-shadow:0 20px 50px rgba(139,92,246,.16),0 2px 6px rgba(0,0,0,.1)}
.machine-card::before{content:"";position:absolute;z-index:-1;left:-120px;top:-120px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.45),rgba(139,92,246,0) 65%)}
.machine-card::after{content:"";position:absolute;z-index:-1;right:-120px;bottom:-140px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,31,.4),rgba(255,90,31,0) 65%)}
.mc-head{display:flex;justify-content:space-between;align-items:center}
.mc-head b{font-size:17px}
.info-btn{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:rgba(255,255,255,.7);background:rgba(255,255,255,.09);padding:6px 10px;border-radius:99px}
.info-btn svg{width:14px;height:14px}
#machineSvg{display:block;width:min(54vw,200px);margin:8px auto 4px;overflow:visible}
.pity{text-align:center;font-size:12.5px;color:rgba(255,255,255,.62);margin-bottom:12px}
.pity b{color:#ffb08a}
.pull-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pull-btn{height:54px;border-radius:16px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15;background:rgba(255,255,255,.1);color:#fff}
.pull-btn.main{background:var(--grad);box-shadow:0 10px 24px rgba(255,90,31,.35)}
.pull-btn small{font-size:11.5px;font-weight:700;opacity:.85;display:flex;gap:3px;align-items:center}
.pull-btn small svg{width:13px;height:13px}
.pull-btn:disabled{opacity:.4}
.pull-btn.gold{grid-column:1/-1;background:linear-gradient(135deg,#ffe066,#f5a300);color:#3a2600;box-shadow:0 10px 24px rgba(245,163,0,.35)}
.pull-btn[hidden]{display:none}

.q-group{margin-bottom:14px}
.q-head{display:flex;align-items:center;gap:7px;margin:0 4px 8px;font-size:14px}
.q-head svg{width:16px;height:16px;color:var(--accent)}
.q-head span{margin-left:auto;font-size:12px;color:var(--muted)}
.q-row{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative}
.q-row+.q-row::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:1px solid var(--line)}
.q-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--fill);color:var(--muted);flex:none}
.q-ic svg{width:18px;height:18px}
.q-row.is-ready .q-ic{background:var(--grad);color:#fff}
.q-main{flex:1;min-width:0}
.q-main b{font-size:14.5px;font-weight:600;display:block;line-height:1.3}
.q-bar{height:5px;border-radius:99px;background:var(--fill);margin-top:7px;overflow:hidden}
.q-bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.q-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.q-rw{display:flex;gap:4px}
.rw{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.rw svg{width:12px;height:12px}
.rw.g{background:rgba(245,163,0,.15);color:#c98200}
.rw.s{background:rgba(139,92,246,.13);color:#7c5cff}
.q-claim{height:30px;min-width:58px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--fill);color:var(--muted)}
.q-row.is-ready .q-claim{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(255,90,31,.35);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.07)}}
.q-done{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.q-done svg{width:14px;height:14px}
.q-row.is-claimed{opacity:.55}
.fly{position:fixed;left:0;top:0;z-index:120;width:22px;height:22px;color:var(--accent);pointer-events:none}
.fly svg{width:22px;height:22px}

.rw-strip{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;text-align:left}
.rw-strip .ic{position:relative;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#8b5cf6,#ff5a1f);color:#fff;display:grid;place-items:center;flex:none}
.rw-strip .ic svg{width:21px;height:21px}
.rw-strip.hot .ic::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:#ff3b30;border:2px solid var(--card)}
.rw-strip .tx{flex:1;min-width:0}
.rw-strip .tx b{display:block;font-size:15px;font-weight:600}
.rw-strip .tx span{font-size:13px;color:var(--muted)}
.rw-strip>svg{width:18px;height:18px;color:var(--muted)}

/* tiers (shared by cards, chips) */
.t-salt{--t1:#eceef3;--t2:#9fa4b0;--tg:rgba(200,204,214,.28)}
.t-common{--t1:#8ff0ff;--t2:#1597ab;--tg:rgba(43,183,201,.32)}
.t-rare{--t1:#d6c2ff;--t2:#7c3aed;--tg:rgba(139,92,246,.42)}
.t-sr{--t1:#fff1a8;--t2:#f59e0b;--tg:rgba(245,163,0,.45)}
.t-legend{--t1:#ffd1ec;--t2:#ff3d7f;--tg:rgba(255,77,141,.45)}
.tier-prog{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tp{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--fill);color:var(--ink2);white-space:nowrap}
.tp i{display:inline-block;width:9px;height:9px;border-radius:50%;background:linear-gradient(150deg,var(--t1),var(--t2));margin-right:5px}
.coll-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cslot{display:block;width:100%}
.holo,.gcard.t-legend,.mcard.t-legend{background:linear-gradient(120deg,#ff4d8d,#ffb347,#fff35c,#4dff88,#4dc3ff,#9b5cff,#ff4d8d)!important;background-size:300% 300%!important;animation:holo 3s linear infinite}
@keyframes holo{to{background-position:300% 0}}

/* mini card */
.mcard{position:relative;aspect-ratio:5/7;border-radius:13px;padding:2px;background:linear-gradient(150deg,var(--t1),var(--t2))}
.mcard-in{position:relative;height:100%;border-radius:11px;background:radial-gradient(circle at 50% 38%,var(--tg),transparent 70%),#17171c;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:4px}
.mc-art{width:78%}
.mc-art svg{width:100%;height:auto;display:block}
.mc-stars{font-size:8px;color:var(--t1);letter-spacing:1px;margin-top:2px}
.mc-name{font-size:10.5px;color:#fff;font-weight:600;text-align:center;line-height:1.25;margin-top:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-cnt{position:absolute;top:5px;right:5px;font-size:10px;font-weight:800;color:#fff;background:rgba(255,255,255,.16);padding:1px 6px;border-radius:99px}
.mc-buddy{position:absolute;top:5px;left:5px;color:#ff6b8a}
.mc-buddy svg{width:13px;height:13px;fill:#ff6b8a}
.mc-new{position:absolute;top:4px;left:4px;font-size:8.5px;font-weight:800;color:#fff;background:#ff3b30;padding:1px 5px;border-radius:99px}
.mcard.tiny .mc-name{display:none}
.mcard.tiny .mc-art{width:86%}
.mcard.locked{background:var(--fill)}
.mcard.locked .mcard-in{background:var(--card)}
.mcard.locked svg{filter:brightness(0);opacity:.1}
.mcard.locked .mc-name{color:var(--muted)}

/* big card */
.gcard{position:relative;width:min(68vw,250px);aspect-ratio:5/7;border-radius:20px;padding:3px;background:linear-gradient(150deg,var(--t1),var(--t2));box-shadow:0 24px 60px rgba(0,0,0,.55)}
.gcard-in{position:relative;height:100%;border-radius:17px;background:linear-gradient(180deg,#1d1d23,#121216);overflow:hidden;display:flex;flex-direction:column}
.gc-top{display:flex;justify-content:space-between;align-items:center;padding:11px 12px 0}
.tier-pill{font-size:11px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:99px;background:linear-gradient(150deg,var(--t1),var(--t2));color:#17171c}
.t-legend .tier-pill{background:linear-gradient(120deg,#ff4d8d,#ffb347,#fff35c,#4dc3ff);color:#2a0a18}
.gc-no{font-size:11px;color:rgba(255,255,255,.45);font-weight:700}
.gc-art{flex:1;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,var(--tg),transparent 66%);min-height:0}
.gc-art svg{width:74%;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}
.gc-meta{padding:0 14px 14px;text-align:center}
.gc-stars{color:var(--t1);font-size:13px;letter-spacing:2px}
.gc-name{font-size:19px;font-weight:700;margin-top:2px;color:#fff}
.gc-desc{font-size:12.5px;color:rgba(255,255,255,.66);line-height:1.45;margin-top:4px}
.gc-new{position:absolute;top:22px;right:-34px;transform:rotate(38deg);background:#ff3b30;color:#fff;font-size:11px;font-weight:800;padding:3px 38px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.t-sr .gcard-in::after,.t-legend .gcard-in::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.26) 45%,transparent 60%);background-size:250% 100%;animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.gc-under{margin-top:14px;text-align:center;font-weight:700;color:rgba(255,255,255,.85);font-size:14px;min-height:20px}
.gc-quip{color:#ffb08a;margin-top:4px;font-size:16px}

/* stage */
.stage{position:fixed;inset:0;z-index:96;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#2a1a24 0%,#0b0b0e 68%);padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 20px)}
.stage.open{display:flex}
.stage-center{position:relative;flex:1;width:100%;display:grid;place-items:center;perspective:900px}
.stage-center>*{grid-area:1/1}
.stage-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.burst{position:absolute;left:50%;top:44%;width:820px;height:820px;margin:-410px 0 0 -410px;border-radius:50%;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,var(--bc,rgba(255,255,255,.2)) 0deg 7deg,transparent 7deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0%,transparent 62%);mask:radial-gradient(circle,#000 0%,transparent 62%);animation:spin 16s linear infinite;transition:opacity .5s}
.burst.on{opacity:.6}
.burst[data-tier="salt"]{--bc:rgba(200,204,214,.22)}
.burst[data-tier="common"]{--bc:rgba(43,183,201,.35)}
.burst[data-tier="rare"]{--bc:rgba(139,92,246,.5)}
.burst[data-tier="sr"]{--bc:rgba(255,200,0,.6)}
.burst[data-tier="legend"]{--bc:rgba(255,77,141,.6)}
@keyframes spin{to{transform:rotate(360deg)}}
.capsule{position:relative;width:136px;height:136px;cursor:pointer;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.cap-top,.cap-bot{position:absolute;left:0;right:0;height:50%}
.cap-top{top:0;border-radius:999px 999px 0 0;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),var(--c1,#eee) 30%,var(--c2,#aaa) 100%)}
.cap-bot{bottom:0;border-radius:0 0 999px 999px;background:radial-gradient(circle at 40% 0%,#fff 0%,#ececf1 55%,#c4c5ce 100%);border-top:4px solid rgba(0,0,0,.16)}
.cap-shine{position:absolute;left:22%;top:13%;width:20%;height:14%;border-radius:50%;background:rgba(255,255,255,.75);pointer-events:none}
.capsule[data-tier="salt"]{--c1:#eceef2;--c2:#a7acb8}
.capsule[data-tier="common"]{--c1:#6fe0ee;--c2:#128fa3}
.capsule[data-tier="rare"]{--c1:#b79bff;--c2:#5b2bd6;filter:drop-shadow(0 0 18px rgba(139,92,246,.6))}
.capsule[data-tier="sr"]{--c1:#ffe066;--c2:#e08600;filter:drop-shadow(0 0 26px rgba(255,200,0,.75))}
.capsule[data-tier="legend"]{filter:drop-shadow(0 0 32px rgba(255,77,141,.8))}
.capsule[data-tier="legend"] .cap-top{background:linear-gradient(120deg,#ff4d8d,#ffb347,#fff35c,#4dff88,#4dc3ff,#9b5cff,#ff4d8d);background-size:300% 300%;animation:holo 2s linear infinite}
.capsule.sm{width:100%;height:auto;aspect-ratio:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.capsule.sm .cap-bot{border-top-width:2px}
.reveal{display:flex;flex-direction:column;align-items:center}
.multi{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(94vw,470px)}
.multi:empty,.reveal:empty{display:none}
.mslot{aspect-ratio:5/7;display:grid;place-items:center}
.mslot>.mcard{width:100%}
.stage-hint{min-height:24px;margin:10px 0 12px;color:rgba(255,255,255,.78);font-weight:600;text-align:center;font-size:15px;animation:pulseTxt 1.6s ease-in-out infinite}
@keyframes pulseTxt{50%{opacity:.5}}
.stage-actions{display:flex;gap:10px;width:min(92vw,420px);min-height:56px}
.st-btn{flex:1;height:54px;border-radius:27px;background:var(--grad);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 10px 26px rgba(255,90,31,.35)}
.st-btn svg{width:18px;height:18px}
.st-btn.ghost{background:rgba(255,255,255,.1);box-shadow:none}
.st-btn:disabled{opacity:.6}

/* drop-rates sheet */
.rmodal{position:fixed;inset:0;z-index:97;display:none;align-items:flex-end;justify-content:center}
.rmodal.open{display:flex}
.rm-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.rm-panel{position:relative;width:100%;max-width:560px;background:var(--sheet);border-radius:24px 24px 0 0;padding:20px 18px calc(var(--sab) + 18px)}
.rm-panel h3{margin:0 0 10px;font-size:19px}
.rate-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rate-row .stars{font-size:11px;color:var(--muted);letter-spacing:1px}
.rate-row .pct{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.rate-notes{font-size:13px;color:var(--muted);margin:12px 0 16px;padding-left:18px;line-height:1.55}
.rate-notes li{margin:4px 0}
.mini-avatar svg,.av-wrap .avatar svg{width:88%;height:88%}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:145}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

        <svg viewBox="0 0 240 240" aria-hidden="true">

            stroke-dasharray="653.45" stroke-dashoffset="653.45" transform="rotate(-90 120 120)"/>

          <div class="lbl" id="heroLabel"></div>

          <div class="sub" id="heroSub"></div>
        </div>

/* ---------- state ---------- */
function detectLang(){ try{ return (navigator.language||'').toLowerCase().startsWith('th') ? 'th' : 'en'; }catch(e){ return 'th'; } }
function blank(){ return { settings:{...DEFAULTS, lang:detectLang()}, log:{}, xp:0, challenges:0, cravings:0, best:0, badges:[], sessions:[], tourDone:false, gacha:{tickets:0,gold:0,shards:0,pity:0,pulls:0,owned:{},buddy:null}, quests:{claimed:{}} }; }
function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    if(r && typeof r==='object'){
      const settings = {...DEFAULTS, ...(r.settings||{})};
      if(!settings.lang) settings.lang = 'th';
      const b=blank(); return {...b, ...r, settings, sessions:r.sessions||[], gacha:{...b.gacha, ...(r.gacha||{}), owned:{...((r.gacha||{}).owned||{})}}, quests:{claimed:{...((r.quests||{}).claimed||{})}}};
    }
  }catch(e){}
  return blank();
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d,12); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const atTime = (base,hhmm) => { const [h,m]=hhmm.split(':').map(Number); const d=new Date(base); d.setHours(h,m,0,0); return d; };
const icon = id => `<svg class="i"><use href="#i-${id}"/></svg>`;
const baht = n => '฿' + Math.round(n).toLocaleString(L().locale);
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function hms(ms){ const s=Math.max(0,Math.floor(ms/1000)); return `${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`; }
function mmss(msv){ const s=Math.max(0,Math.floor(msv/1000)); return `${Math.floor(s/60)}:${pad(s%60)}`; }
function hrsMin(msv){ const m=Math.max(0,Math.round(msv/60000)); const h=Math.floor(m/60), mm=m%60; return h ? t('hm',{h,m:mm}) : t('mOnly',{m:mm}); }
function fastHours(){ const [ch,cm]=S.settings.cutoff.split(':').map(Number), [bh,bm]=S.settings.breakfast.split(':').map(Number);
  const mins=((bh*60+bm)+1440-(ch*60+cm))%1440; return t('hours',{n:Math.round(mins/6)/10}); }

function nightKey(now=new Date()){ return keyOf(now < atTime(now,S.settings.breakfast) ? addDays(now,-1) : now); }
function fastingState(now=new Date()){
  const {cutoff,breakfast} = S.settings;
  const cut = atTime(now,cutoff), brk = atTime(now,breakfast);
  if(now < brk) return { fasting:true, start:atTime(addDays(now,-1),cutoff), end:brk };
  if(now >= cut) return { fasting:true, start:cut, end:atTime(addDays(now,1),breakfast) };
  return { fasting:false, since:brk, start:cut, end:atTime(addDays(now,1),breakfast) };
}
function countStatus(s){ return Object.values(S.log).filter(v=>v===s).length; }
const nightSaving = s => s==='ok' ? Number(S.settings.cost||0) : s==='light' ? Number(S.settings.cost||0)/2 : 0;
function saved(){ return Object.values(S.log).reduce((a,s)=>a+nightSaving(s),0); }
function streak(){
  let d = fromKey(nightKey());
  if(!S.log[keyOf(d)]) d = addDays(d,-1);
  let n=0; while(S.log[keyOf(d)]==='ok'||S.log[keyOf(d)]==='light'){ n++; d=addDays(d,-1); }
  return n;
}
function levelInfo(xp){ let Lv=1; while(xp >= 50*(Lv+1)*Lv) Lv++; const base=50*Lv*(Lv-1), next=50*(Lv+1)*Lv; return {L:Lv,cur:xp-base,need:next-base}; }
const levelName = Lv => L().levels[Math.min(Lv,L().levels.length)-1];

/* ---------- motion ---------- */
function countTo(el, to, fmt=v=>Math.round(v), unitKey){
  const from = el.dataset.v==null ? 0 : Number(el.dataset.v);
  el.dataset.v = to;
  const draw = v => { el.innerHTML = fmt(v) + (unitKey ? `<span class="u">${t(unitKey)}</span>` : ''); };
  if(el._tw) el._tw.kill();
  if(!HAS_GSAP || from===to){ draw(to); return; }
  const o={v:from}; el._tw = gsap.to(o,{v:to,duration:1.1,ease:'power3.out',onUpdate:()=>draw(o.v)});
}
function animateIn(section){
  if(!HAS_GSAP) return;
  gsap.fromTo(section.querySelectorAll('.anim'), {opacity:0,y:18}, {opacity:1,y:0,duration:.55,stagger:.05,ease:'power3.out',clearProps:'transform,opacity'});
}
let fire = null;
function celebrate(power=1){
  if(REDUCE || !window.confetti) return;
  if(!fire) fire = confetti.create($('confetti'), {resize:true, useWorker:true});
  const colors=['#ff3d00','#ff6a2b','#ff9a62','#ffd2bf','#ffffff'];
  fire({particleCount:Math.round(70*power), spread:70, startVelocity:42, origin:{y:.72}, colors, scalar:.9, ticks:220});
  setTimeout(()=>fire({particleCount:Math.round(40*power), spread:110, origin:{y:.6}, colors, scalar:.75, ticks:200}), 160);
}
function pop(el){ if(HAS_GSAP && el) gsap.fromTo(el,{scale:.85},{scale:1,duration:.5,ease:'back.out(3)'}); }

/* ---------- feedback ---------- */
let toastT;
function toast(msg){ $('toastText').textContent=msg; const el=$('toast'); el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2400); }
function gainXP(n){
  const before = levelInfo(S.xp).L;
  S.xp = Math.max(0, S.xp+n);
  const after = levelInfo(S.xp).L;
  if(after>before) setTimeout(()=>{ toast(t('levelUp',{name:levelName(after), l:after})); celebrate(1.2); }, 2600);
}
function checkBadges(){
  S.best = Math.max(S.best||0, streak());
  let delay = 0;
  for(const b of BADGES){
    if(!S.badges.includes(b.id) && b.test(S)){
      S.badges.push(b.id);
      delay += 2600; setTimeout(()=>{ toast(t('badgeGot',{name:L().badges[b.id]})); celebrate(.6); }, delay);
    }
  }
}

/* ---------- check-in ---------- */
function checkinTarget(){
  const now=new Date(), fs=fastingState(now);
  if(!fs.fasting){
    const last = keyOf(addDays(now,-1));
    if(!S.log[last]) return { key:last, title:'ciLastNight', open:true };
    return { key:keyOf(now), title:'ciTonight', open:false };
  }
  return { key:nightKey(now), title:'ciTonight', open:true };
}
function setStatus(key,status){
  const old = S.log[key];
  if(old) gainXP(-XP_VAL[old]);
  if(status){ S.log[key]=status; gainXP(XP_VAL[status]); } else delete S.log[key];
  checkBadges(); save(); renderAll();
}

/* ---------- static text ---------- */
function applyStatic(){
  document.documentElement.lang = lang;
  document.title = t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $('navTitle').textContent = t($('tab-'+tab).dataset.title);
  $('langBtnText').textContent = lang==='th' ? 'EN' : 'ไทย';
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('sel', b.dataset.lang===lang));
}
function setLang(l){
  if(l===lang) return;
  lang = l; S.settings.lang = l; save();
  applyStatic(); destroyCharts(); renderAll();
  if(tab==='progress') renderCharts(fromKey(nightKey()));
  if($('sos').classList.contains('open') && sos){ showMission(); tickSOS(); }
  toast(t('langSwitched'));
}

/* ---------- render: home ---------- */
function renderHome(){
  const now=new Date();
  $('homeDate').textContent = L().homeDate(now, L());
  $('homeTitle').textContent = S.settings.name ? t('hello',{name:S.settings.name}) : t('tabToday');
  $('miniAvatar').innerHTML = avatarHTML();
  $('phaseRange').textContent = `${S.settings.cutoff} – ${S.settings.breakfast}`;
  $('mClose').textContent = S.settings.cutoff; $('mBreak').textContent = S.settings.breakfast; $('mGoal').textContent = fastHours();
  renderTimer();

  const tg=checkinTarget(), cur=S.log[tg.key];
  $('ciTitle').textContent = t(tg.title);
  $('ciDate').textContent = `${L().daysShort[fromKey(tg.key).getDay()]} ${fmtDate(fromKey(tg.key))}`;
  $('seg').classList.toggle('locked', !tg.open);
  const idx = ['ok','light','miss'].indexOf(cur), th=$('segThumb');
  th.style.opacity = idx<0 ? 0 : 1; th.className = 'thumb ' + (cur||'');
  if(idx>=0) th.style.transform = `translateX(${idx*100}%)`;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('sel', b.dataset.s===cur));
  $('ciNote').innerHTML = (!tg.open ? icon('timer') + t('ciLocked',{t:S.settings.cutoff})
    : cur ? icon('check') + t('ciSaved',{xp:XP_VAL[cur]}) : icon('sparkles') + t('ciHint'));

  const tonight=fromKey(nightKey(now)), mon=mondayOf(tonight);
  let html='', cnt=0;
  for(let i=0;i<7;i++){
    const d=addDays(mon,i), k=keyOf(d), s=S.log[k];
    if(s==='ok'||s==='light') cnt++;
    const inner = s==='ok'||s==='light' ? icon('check') : d.getDate();
    html += `<div><div class="wd">${L().weekHead[i]}</div><div class="dotday ${s||''} ${k===keyOf(tonight)?'today':''}">${inner}</div></div>`;
  }
  $('week').innerHTML = html;
  $('weekCount').textContent = t('weekCount',{n:cnt});

  countTo($('stStreak'), streak(), undefined, 'nights');
  countTo($('stSaved'), saved(), baht);
  countTo($('stFought'), S.cravings, undefined, 'times');
}

function renderTimer(){
  const now=new Date(), fs=fastingState(now), hero=$('hero');
  let p;
  if(fs.fasting){
    const total=fs.end-fs.start, done=now-fs.start; p=Math.min(1,done/total);
    hero.classList.add('live'); hero.classList.remove('day');
    $('phaseText').textContent=t('fasting');
    $('heroLabel').textContent=t('fastingFor');
    $('heroTime').textContent=hms(done);
    $('heroSub').textContent=t('left',{t:hrsMin(fs.end-now)});
  }else{
    const total=fs.start-fs.since, left=fs.start-now; p=Math.min(1,Math.max(0,1-left/total));
    hero.classList.remove('live'); hero.classList.add('day');
    $('phaseText').textContent=t('eating');
    $('heroLabel').textContent=t('closesIn');
    $('heroTime').textContent=hms(left);
    $('heroSub').textContent = left<3600000 ? t('lastMealSoon') : t('eatLunch');
  }
  $('ringArc').style.strokeDashoffset = RING_C*(1-p);
  const a = (-90 + 360*p) * Math.PI/180;
  $('ringKnob').setAttribute('cx', 120 + 104*Math.cos(a));
  $('ringKnob').setAttribute('cy', 120 + 104*Math.sin(a));
}

/* ---------- render: progress ---------- */
let calMonth = (()=>{ const d=fromKey(nightKey()); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let weekChart=null, saveChart=null;
function destroyCharts(){ weekChart?.destroy(); saveChart?.destroy(); weekChart=saveChart=null; }

function renderProgress(){
  const tn=fromKey(nightKey()), y=tn.getFullYear(), m=tn.getMonth();
  const entries = Object.entries(S.log).filter(([k])=>{ const d=fromKey(k); return d.getFullYear()===y && d.getMonth()===m; });
  const good = entries.filter(([,s])=>s==='ok'||s==='light').length;
  countTo($('pmNights'), entries.filter(([,s])=>s==='ok').length, undefined, 'nights');
  if(entries.length) countTo($('pmRate'), Math.round(good/entries.length*100), v=>Math.round(v)+'%');
  else { $('pmRate').textContent='–'; delete $('pmRate').dataset.v; }
  countTo($('pmSaved'), entries.reduce((a,[,s])=>a+nightSaving(s),0), baht);
  if(tab==='progress') renderCharts(tn);
  renderCal(); renderFeed();
}

function gradFill(ctx, area, a, b){ const g=ctx.createLinearGradient(0,area.bottom,0,area.top); g.addColorStop(0,a); g.addColorStop(1,b); return g; }

function renderCharts(tonight){
  if(!window.Chart) return;
  const th = { muted:cssVar('--muted'), line:cssVar('--line'), light:cssVar('--light'), card:cssVar('--card'), ink:cssVar('--ink') };
  Chart.defaults.font.family = '-apple-system,BlinkMacSystemFont,"Inter","IBM Plex Sans Thai",sans-serif';
  Chart.defaults.color = th.muted;
  const tooltip = { backgroundColor:th.ink, titleColor:th.card, bodyColor:th.card, padding:10, cornerRadius:10, displayColors:false };

  // weekly bars (last 8 weeks)
  const mon=mondayOf(tonight), labels=[], ok=[], li=[];
  for(let w=7; w>=0; w--){
    const ws=addDays(mon,-7*w); let o=0, l=0;
    for(let i=0;i<7;i++){ const s=S.log[keyOf(addDays(ws,i))]; if(s==='ok') o++; else if(s==='light') l++; }
    labels.push(w===0 ? t('thisWk') : fmtDate(ws)); ok.push(o); li.push(l);
  }
  const avg = Math.round(ok.slice(4).reduce((a,b)=>a+b,0)/4*10)/10;
  countTo($('weekAvg'), avg, v=>(Math.round(v*10)/10).toLocaleString(L().locale,{minimumFractionDigits:1,maximumFractionDigits:1}), 'perWk');
  if(weekChart){ weekChart.data.labels=labels; weekChart.data.datasets[0].data=ok; weekChart.data.datasets[1].data=li; weekChart.update(); }
  else weekChart = new Chart($('weekChart'), {
    type:'bar',
    data:{ labels, datasets:[
      { label:t('stOk'), data:ok, borderRadius:7, borderSkipped:false, barPercentage:.58, categoryPercentage:.9,
        backgroundColor:c=>{ const {ctx,chartArea}=c.chart; return chartArea ? gradFill(ctx,chartArea,'#ff3d00','#ff9a62') : '#ff5a1f'; } },
      { label:t('stLight'), data:li, borderRadius:7, borderSkipped:false, barPercentage:.58, categoryPercentage:.9, backgroundColor:th.light },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, animation:{duration:REDUCE?0:900, easing:'easeOutQuart'},
      plugins:{ legend:{display:false}, tooltip },
      scales:{ x:{ stacked:true, grid:{display:false}, border:{display:false}, ticks:{font:{size:10}, maxRotation:0, autoSkip:true, maxTicksLimit:5} },
               y:{ stacked:true, min:0, max:7, ticks:{stepSize:7, font:{size:10}}, grid:{color:th.line}, border:{display:false} } } }
  });

  // cumulative savings, last 30 days
  const sLabels=[], sData=[], keys=Object.keys(S.log).sort(), start=addDays(tonight,-29);
  let run=0, ki=0;
  while(ki<keys.length && keys[ki]<keyOf(start)){ run+=nightSaving(S.log[keys[ki]]); ki++; }
  for(let i=0;i<30;i++){
    const d=addDays(start,i), k=keyOf(d);
    while(ki<keys.length && keys[ki]<=k){ run+=nightSaving(S.log[keys[ki]]); ki++; }
    sLabels.push(fmtDate(d)); sData.push(run);
  }
  countTo($('saveTotal'), saved(), baht);
  if(saveChart){ saveChart.data.labels=sLabels; saveChart.data.datasets[0].data=sData; saveChart.update(); }
  else saveChart = new Chart($('saveChart'), {
    type:'line',
    data:{ labels:sLabels, datasets:[{ data:sData, borderColor:'#ff5a1f', borderWidth:2.5, tension:.38, pointRadius:0, pointHoverRadius:5,
      pointHoverBackgroundColor:'#ff5a1f', pointHoverBorderColor:'#fff', pointHoverBorderWidth:2, fill:true,
      backgroundColor:c=>{ const {ctx,chartArea}=c.chart; return chartArea ? gradFill(ctx,chartArea,'rgba(255,90,31,0)','rgba(255,90,31,.28)') : 'rgba(255,90,31,.15)'; } }]},
    options:{ responsive:true, maintainAspectRatio:false, animation:{duration:REDUCE?0:1100, easing:'easeOutQuart'},
      interaction:{mode:'index', intersect:false},
      plugins:{ legend:{display:false}, tooltip:{...tooltip, callbacks:{label:c=>baht(c.parsed.y)}} },
      scales:{ x:{ grid:{display:false}, border:{display:false}, ticks:{font:{size:10}, maxRotation:0, maxTicksLimit:4} },
               y:{ beginAtZero:true, suggestedMax:Math.max(100, Number(S.settings.cost||0)*4), ticks:{font:{size:10}, maxTicksLimit:4, precision:0, callback:v=>'฿'+Number(v).toLocaleString(L().locale)}, grid:{color:th.line}, border:{display:false} } } }
  });
}

function renderCal(){
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  $('calTitle').textContent = L().monthYear(m,y,L());
  const tonight=fromKey(nightKey()), first=new Date(y,m,1,12), days=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7;
  const cal=$('cal'); cal.innerHTML = L().weekHead.map(d=>`<div class="wd">${d}</div>`).join('') + '<div class="blank"></div>'.repeat(lead);
  for(let i=1;i<=days;i++){
    const d=new Date(y,m,i,12), k=keyOf(d), s=S.log[k], future=d>tonight;
    const b=document.createElement('div');
    b.innerHTML = `<button class="dotday press ${s||''} ${k===keyOf(tonight)?'today':''} ${future?'future':''}" ${future?'disabled':''} aria-label="${fmtDate(d)}">${i}</button>`;
    if(!future) b.firstChild.onclick = ()=>openSheet(k);
    cal.appendChild(b);
  }
  const nextMonth = new Date(y,m+1,1);
  $('calNext').disabled = nextMonth > tonight; $('calNext').style.opacity = nextMonth > tonight ? .3 : 1;
}

function renderFeed(){
  const keys = Object.keys(S.log).sort().reverse().slice(0,12);
  if(!keys.length){ $('feed').innerHTML = `<div class="empty">${t('empty')}</div>`; return; }
  const T = { ok:'feedOk', light:'feedLight', miss:'feedMiss' };
  const I = { ok:'check', light:'coffee', miss:'utensils-crossed' };
  $('feed').innerHTML = keys.map(k=>{
    const s=S.log[k], d=fromKey(k);
    const fights = S.sessions.filter(x=>nightKey(new Date(x.t))===k).length;
    const sub = `${L().daysShort[d.getDay()]} ${fmtDate(d)}` + (s==='ok'?` · ${fastHours()}`:'') + (fights?` · ${t('feedFights',{n:fights})}`:'');
    const r = nightSaving(s) ? '+'+baht(nightSaving(s)) : '';
    return `<div class="row"><div class="ic ${s}">${icon(I[s])}</div><div class="t"><b>${t(T[s])}</b><span>${sub}</span></div><div class="r num">${r}</div></div>`;
  }).join('');
}

/* ---------- SOS ---------- */
let sos = null, sosTimer = null, missionIdx = -1;
function showMission(){ $('mText').textContent = L().missionList[missionIdx] || ''; }
function newMission(){
  const n = L().missionList.length; let i;
  do{ i=Math.floor(Math.random()*n); }while(n>1 && i===missionIdx);
  missionIdx=i; showMission(); $('mDone').disabled=false; $('mDoneText').textContent=t('mDone');
  if(HAS_GSAP) gsap.fromTo('#mText',{opacity:0,y:8},{opacity:1,y:0,duration:.35,ease:'power2.out'});
}
function tickSOS(){
  const el=Date.now()-sos.start, left=WAVE_MS-el;
  $('sosClock').textContent = left>0 ? mmss(left+999) : mmss(el);
  $('sosCue').textContent = (el/1000)%10 < 4 ? t('breatheIn') : t('breatheOut');
  $('sosSub').textContent = left>0 ? t('sosSub') : t('sosSubDone');
  $('cdArc').style.strokeDashoffset = CD_C*(1-Math.max(0,left)/WAVE_MS);
}
$('sosBtn').onclick = ()=>{
  sos = { start:Date.now(), missions:0, xp:0 };
  newMission();
  const br=$('breath'); br.classList.remove('go'); void br.offsetWidth; br.classList.add('go');
  $('sos').classList.remove('done'); $('sos').classList.add('open');
  document.body.style.overflow='hidden';
  tickSOS(); clearInterval(sosTimer); sosTimer=setInterval(tickSOS,250);
  if(HAS_GSAP){
    gsap.fromTo('#sos',{opacity:0},{opacity:1,duration:.3});
    gsap.fromTo('#sos .run > *',{opacity:0,y:24},{opacity:1,y:0,duration:.6,stagger:.07,ease:'power3.out',clearProps:'transform,opacity'});
  }
};
function closeSOS(){
  clearInterval(sosTimer);
  const done=()=>{ $('sos').classList.remove('open'); document.body.style.overflow=''; renderAll(); };
  if(HAS_GSAP) gsap.to('#sos',{opacity:0,duration:.25,onComplete:()=>{ done(); gsap.set('#sos',{clearProps:'opacity'}); }}); else done();
}
$('sosClose').onclick = closeSOS;
$('mShuffle').onclick = newMission;
$('mDone').onclick = ()=>{
  S.challenges++; gainXP(10); sos.missions++; sos.xp+=10; checkBadges(); save();
  $('mDone').disabled=true; $('mDoneText').textContent=t('mDoneOk');
  pop($('mDone'));
  setTimeout(newMission, 900);
};
$('sosFinish').onclick = ()=>{
  clearInterval(sosTimer);
  const dur = Date.now()-sos.start;
  S.cravings++; S.sessions.push({ t:Date.now(), d:Math.round(dur/1000) }); if(S.sessions.length>300) S.sessions.shift();
  gainXP(10); sos.xp+=10; checkBadges(); save();
  $('sumTime').textContent = mmss(dur);
  $('sumMissions').textContent = sos.missions;
  $('sumXP').textContent = '+'+sos.xp;
  $('sumMsg').textContent = t('sumMsg',{n:S.cravings});
  $('sos').classList.add('done');
  if(HAS_GSAP){
    gsap.fromTo('#sos .summary .ok',{scale:.2,opacity:0,rotate:-30},{scale:1,opacity:1,rotate:0,duration:.7,ease:'back.out(2.2)'});
    gsap.fromTo('#sos .summary > :not(.ok)',{opacity:0,y:20},{opacity:1,y:0,duration:.5,stagger:.08,delay:.2,ease:'power3.out',clearProps:'transform,opacity'});
  }
  celebrate(1.1);
};
$('sosDone').onclick = closeSOS;

/* ---------- gacha: tiers & characters ---------- */
const TIERS = {
  salt:   { rate:45, shard:1,  stars:1 },
  common: { rate:32, shard:2,  stars:2 },
  rare:   { rate:16, shard:4,  stars:3 },
  sr:     { rate:6,  shard:10, stars:4 },
  legend: { rate:1,  shard:25, stars:5 },
};
const TIER_ORDER = ['salt','common','rare','sr','legend'];
const PITY = 10;
const tierIdx = k => TIER_ORDER.indexOf(k);

const INK = '#2b1d16';
function F(cx,cy,s=1,e='open',mo='smile'){
  const ex=8.5*s, sw=(2.3*s).toFixed(2), my=cy+6.5*s;
  const P=d=>`<path d="${d}" stroke="${INK}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
  let o='';

/* ---------- quests ---------- */
function questNight(){
  const now=new Date();
  if(fastingState(now).fasting) return nightKey(now);
  const y=keyOf(addDays(now,-1));
  const pending = dailyQuests(y).some(q=>q.cur>=q.goal && !S.quests.claimed[q.id]);
  return (!S.log[y] || pending) ? y : keyOf(now);
}
const nightHadSos = k => S.sessions.some(x=>nightKey(new Date(x.t))===k);
function dailyQuests(k){ return [
  { id:`d:${k}:checkin`, icon:'check',        title:t('qCheckin'), cur:S.log[k]?1:0,        goal:1, reward:{shards:1} },
  { id:`d:${k}:fast`,    icon:'moon-star',    title:t('qFast'),    cur:S.log[k]==='ok'?1:0, goal:1, reward:{shards:3} },
  { id:`d:${k}:sos`,     icon:'shield-check', title:t('qSos'),     cur:nightHadSos(k)?1:0,  goal:1, reward:{shards:2} },
]; }
function weeklyQuests(k){
  const mon=mondayOf(fromKey(k)), wk=keyOf(mon); let ok=0, logged=0;
  for(let i=0;i<7;i++){ const s=S.log[keyOf(addDays(mon,i))]; if(s) logged++; if(s==='ok') ok++; }
  return [
    { id:`w:${wk}:fast3`, icon:'flame',          title:t('qWeek3'),   cur:Math.min(ok,3), goal:3, reward:{tickets:1} },
    { id:`w:${wk}:fast5`, icon:'flame',          title:t('qWeek5'),   cur:Math.min(ok,5), goal:5, reward:{tickets:2} },
    { id:`w:${wk}:log7`,  icon:'calendar-check', title:t('qWeekLog'), cur:logged,         goal:7, reward:{tickets:1} },
  ];
}
const MILESTONES = [
  { track:'streak',  icon:'flame',     val:()=>Math.max(S.best||0, streak()), title:n=>t('qStreak',{n}),
    items:[[3,{tickets:1}],[7,{tickets:2}],[14,{tickets:3}],[21,{tickets:3}],[30,{tickets:3,gold:1}],[60,{tickets:5,gold:1}],[100,{tickets:8,gold:2}]] },
  { track:'total',   icon:'moon-star', val:()=>countStatus('ok'), title:n=>t('qTotal',{n}),
    items:[[1,{tickets:1}],[10,{tickets:2}],[25,{tickets:3}],[50,{tickets:3,gold:1}],[100,{tickets:5,gold:1}]] },
  { track:'collect', icon:'book-open', val:()=>ownedCount(), title:n=>t('qCollect',{n}),
    items:[[6,{tickets:1}],[12,{tickets:2}],[18,{tickets:3,gold:1}]] },
];
function milestoneQuests(){
  const out=[];
  if(!S.quests.claimed['m:welcome']) out.push({ id:'m:welcome', icon:'gift', title:t('qWelcome'), cur:1, goal:1, reward:{tickets:1} });
  for(const tr of MILESTONES){
    const v=tr.val(); let lockedShown=false;
    for(const [n,reward] of tr.items){
      const id=`m:${tr.track}:${n}`;
      if(S.quests.claimed[id]) continue;
      if(v>=n) out.push({ id, icon:tr.icon, title:tr.title(n), cur:n, goal:n, reward });
      else if(!lockedShown){ out.push({ id, icon:tr.icon, title:tr.title(n), cur:v, goal:n, reward }); lockedShown=true; }
    }
  }
  return out;
}
function allQuests(){ const k=questNight(); return { k, daily:dailyQuests(k), weekly:weeklyQuests(k), milestones:milestoneQuests() }; }
const isClaimable = q => q.cur>=q.goal && !S.quests.claimed[q.id];
function claimableCount(){ const a=allQuests(); return [...a.daily,...a.weekly,...a.milestones].filter(isClaimable).length; }

function rewardChips(r){
  let h='';
  if(r.tickets) h+=`<span class="rw t">${icon('ticket')}${r.tickets}</span>`;
  if(r.gold) h+=`<span class="rw g">${icon('ticket')}${r.gold}</span>`;
  if(r.shards) h+=`<span class="rw s">✦${r.shards}</span>`;
  return h;
}
function rewardText(r){
  const p=[];
  if(r.tickets) p.push(`${t('tickets')} ×${r.tickets}`);
  if(r.gold) p.push(`${t('gold')} ×${r.gold}`);
  if(r.shards) p.push(`✦ ×${r.shards}`);
  return p.join(' · ');
}
let questIndex = {};
function claimQuest(id, btn){
  const q=questIndex[id]; if(!q || !isClaimable(q)) return;
  S.quests.claimed[id]=true;
  const g=S.gacha; g.tickets+=q.reward.tickets||0; g.gold+=q.reward.gold||0; g.shards+=q.reward.shards||0;
  save(); flyReward(btn); toast(t('claimedToast',{r:rewardText(q.reward)}));

function flyReward(btn){
  if(!HAS_GSAP || !btn) return;

      {x:to.left+to.width*(.2+Math.random()*.6), y:to.top+to.height/2, scale:1, opacity:.2, duration:.7+Math.random()*.25, delay:i*.04, ease:'power2.in', onComplete:()=>d.remove()});
  }
  setTimeout(()=>pop($('wallet')), 750);

/* ---------- gacha pulls ---------- */
let gBusy=false;
function rollTier(force){
  if(force) return Math.random()<.85 ? 'sr' : 'legend';
  let r=Math.random()*100;
  for(const k of TIER_ORDER){ r-=TIERS[k].rate; if(r<0) return k; }
  return 'salt';
}
function grant(tier){
  const g=S.gacha, pool=CHARS.filter(c=>c.tier===tier), ch=pool[Math.floor(Math.random()*pool.length)];
  const isNew=!g.owned[ch.id];
  g.owned[ch.id]=(g.owned[ch.id]||0)+1; g.pulls++;
  const shards=isNew?0:TIERS[tier].shard; g.shards+=shards;
  return { ch, tier, isNew, shards };
}
function pullOne(gold){
  const g=S.gacha, tier=rollTier(gold || g.pity>=PITY-1);
  g.pity = tierIdx(tier)>=3 ? 0 : g.pity+1;
  return grant(tier);
}
function pullTen(){
  const res=[]; for(let i=0;i<10;i++) res.push(pullOne(false));
  if(!res.some(r=>tierIdx(r.tier)>=2)){
    const last=res[9], g=S.gacha;
    g.owned[last.ch.id]--; if(!g.owned[last.ch.id]) delete g.owned[last.ch.id];
    g.shards-=last.shards; g.pulls--;
    res[9]=grant('rare');
  }
  return res;
}
async function startPull(kind){
  if(gBusy) return;
  const g=S.gacha, cost = kind==='ten' ? 10 : 1, fromStage=$('stage').classList.contains('open');
  if(kind==='gold'){ if(g.gold<1) return; g.gold--; }
  else if(g.tickets<cost){ toast(t('noTickets')); if(HAS_GSAP) gsap.fromTo('#machineSvg',{x:-6},{x:0,duration:.4,ease:'elastic.out(1,.3)'}); return; }
  else g.tickets-=cost;
  gBusy=true;
  const results = kind==='ten' ? pullTen() : [pullOne(kind==='gold')];
  checkBadges(); save(); renderRewards();
  if(!fromStage) await machineAnim();
  openStage(results);
}
function machineAnim(){
  if(!HAS_GSAP) return Promise.resolve();
  return new Promise(res=>{
    const tl=gsap.timeline({onComplete:res});
    tl.to('#knob',{rotation:'+=360', svgOrigin:'72 206', duration:.85, ease:'power2.inOut'},0)
      .to('#machineSvg',{x:'random(-4,4)', duration:.05, repeat:12, yoyo:true, repeatRefresh:true},0)
      .to('#domeCaps .cj',{y:'random(-10,4)', x:'random(-5,5)', rotation:'random(-30,30)', duration:.12, repeat:5, yoyo:true, repeatRefresh:true, stagger:.01},0)
      .set('#machineSvg',{x:0})
      .set('#domeCaps .cj',{x:0,y:0,rotation:0});
  });
}
function renderMachine(){
  const box=$('domeCaps'); if(box.childElementCount) return;
  const cols=['#f0f1f5','#f0f1f5','#5fd3e2','#5fd3e2','#a98bff','#ffd24d','#ff7a3d','#f0f1f5','#5fd3e2','#a98bff','#ff9fc8','#ffd24d','#5fd3e2','#f0f1f5','#a98bff','#ff7a3d'];
  let h='';
  for(let i=0;i<16;i++){
    const row=Math.floor(i/5), x=46+((i%5)*27)+(row%2?13:0), y=142-row*22-(Math.random()*4), a=Math.round(Math.random()*360);
    h+=`<g transform="translate(${x} ${y})"><g class="cj"><g transform="rotate(${a})"><circle r="12" fill="${cols[i]}"/><path d="M-12 0 a12 12 0 0 0 24 0z" fill="#fff"/><circle r="12" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1.2"/><ellipse cx="-4" cy="-6" rx="3.5" ry="2" fill="rgba(255,255,255,.7)"/></g></g></g>`;

/* ---------- stage (capsule → card reveal) ---------- */
function stageReset(){
  $('reveal').innerHTML=''; $('multi').innerHTML=''; $('stageActions').innerHTML=''; $('stageHint').textContent='';
  $('burst').className='burst'; const cap=$('capsule');
  if(HAS_GSAP) gsap.set(cap,{clearProps:'all'});

  cap.style.display='none'; cap.onclick=null;
}
function stageOpen(){
  stageReset();
  const st=$('stage');
  if(!st.classList.contains('open')){ st.classList.add('open'); document.body.style.overflow='hidden'; if(HAS_GSAP) gsap.fromTo(st,{opacity:0},{opacity:1,duration:.3}); }
}
function closeStage(){
  gBusy=false;
  const done=()=>{ $('stage').classList.remove('open'); stageReset(); document.body.style.overflow=''; renderAll(); };
  if(HAS_GSAP) gsap.to('#stage',{opacity:0,duration:.25,onComplete:()=>{ done(); gsap.set('#stage',{clearProps:'opacity'}); }}); else done();
}
function openStage(results){
  stageOpen();
  if(results.length===1) showCapsule(results[0]); else showMulti(results);
}
function flash(){ if(HAS_GSAP) gsap.fromTo('#stageFlash',{opacity:.85},{opacity:0,duration:.7,ease:'power2.out'}); }
function showCapsule(r){
  const real=r.tier, cap=$('capsule');
  let shown=real;
  if(tierIdx(real)>=3 && Math.random()<.5) shown = Math.random()<.5 ? 'common' : 'rare';
  else if(real==='legend' && Math.random()<.6) shown='sr';
  cap.dataset.tier=shown; cap.style.display='';
  $('stageHint').textContent=t('tapToOpen');
  if(HAS_GSAP) gsap.fromTo(cap,{y:-innerHeight*.7,rotation:-240,scale:.8},{y:0,rotation:0,scale:1,duration:1.1,ease:'bounce.out'});
  let busy=false;
  cap.onclick = async ()=>{
    if(busy) return; busy=true;
    if(cap.dataset.tier!==real){
      $('stageHint').textContent=t('tapAgain');
      if(HAS_GSAP){ await gsap.to(cap,{x:'random(-14,14)',rotation:'random(-18,18)',duration:.06,repeat:11,yoyo:true,repeatRefresh:true}); gsap.set(cap,{x:0,rotation:0}); }
      flash();
      const next = TIER_ORDER[Math.min(tierIdx(real), Math.max(tierIdx(cap.dataset.tier)+1, 3))];
      cap.dataset.tier=next;
      if(HAS_GSAP) gsap.fromTo(cap,{scale:1.4},{scale:1,duration:.6,ease:'back.out(3)'});
      if(navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) try{ navigator.vibrate(40); }catch(e){}
      if(next===real) $('stageHint').textContent=t('tapToOpen');
      busy=false; return;
    }
    await openCapsule(cap, r);
  };
}
async function openCapsule(cap, r){
  $('stageHint').textContent='';
  if(HAS_GSAP){
    await gsap.to(cap,{rotation:14,duration:.07,repeat:5,yoyo:true,ease:'power1.inOut'});
    gsap.set(cap,{rotation:0});
    gsap.to(cap.querySelector('.cap-top'),{y:-160,rotation:-50,opacity:0,duration:.6,ease:'power2.out'});
    gsap.to(cap.querySelector('.cap-bot'),{y:160,rotation:35,opacity:0,duration:.6,ease:'power2.out'});
    flash();
    await new Promise(res=>setTimeout(res,220));
  }
  cap.style.display='none';
  revealCard(r);
}
function quipFor(tier){
  if(tier==='salt'){ const q=L().saltQuips; return q[Math.floor(Math.random()*q.length)]; }
  return t('quip_'+tier);
}
function revealCard(r){
  const b=$('burst'); b.dataset.tier=r.tier; b.className='burst on';
  $('reveal').innerHTML = cardHTML(r.ch, { isNew:r.isNew, shards:r.shards, count:S.gacha.owned[r.ch.id], quip:quipFor(r.tier) });
  const card=$('reveal').querySelector('.gcard');
  if(HAS_GSAP){
    gsap.fromTo(card,{rotationY:180,scale:.4,opacity:0},{rotationY:0,scale:1,opacity:1,duration:.9,ease:'back.out(1.4)'});
    gsap.fromTo('#reveal .gc-under',{opacity:0,y:10},{opacity:1,y:0,duration:.4,delay:.6});
  }
  const ti=tierIdx(r.tier);
  if(ti>=3) celebrate(ti===4?2.2:1.3); else if(ti===2) celebrate(.6);
  if(navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) try{ navigator.vibrate(ti>=3?[50,40,120]:25); }catch(e){}
  const again = S.gacha.tickets>=1 ? `<button class="st-btn ghost press" id="stAgain">${icon('sparkles')}${t('again')}</button>` : '';
  $('stageActions').innerHTML = again + `<button class="st-btn press" id="stKeep">${t('keep')}</button>`;

function showMulti(res){

async function openAll(res){
