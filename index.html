<script>
/* Runs before the rest of the page loads: pick the language, rotate the fun
   messages, and make sure the splash can never get stuck if the app fails to boot. */
(function(){
  var $ = function(id){ return document.getElementById(id); }, th = true, saved = null;
  try{ saved = JSON.parse(localStorage.getItem('skipdinner.v1')); }catch(e){}
  if(saved && typeof saved === 'object'){ var l = saved.settings && saved.settings.lang; th = !l || l === 'th'; }
  else{ try{ th = (navigator.language || '').toLowerCase().indexOf('th') === 0; }catch(e){} }
  var M = th ? ['กำลังล็อกตู้เย็น…', 'กำลังปิดเตา…', 'กำลังซ่อนขนม…', 'มูนนี่กำลังใส่หมวกเชฟ…']
             : ['Locking the fridge…', 'Turning off the stove…', 'Hiding the snacks…', 'Moonie is putting on the chef hat…'];
  if(!th){
    $('spName').textContent = 'Kitchen Closed'; $('spTag').textContent = 'Skip dinner, the fun way';
    $('splash').setAttribute('aria-label', 'Kitchen Closed is loading');
  }
  var msg = $('spMsg'), i = Math.floor(Math.random() * M.length);
  msg.textContent = M[i];
  window.__spTick = setInterval(function(){
    msg.classList.add('swap');
    setTimeout(function(){ if(window.__spStop) return; i = (i + 1) % M.length; msg.textContent = M[i]; msg.classList.remove('swap'); }, 200);
  }, 1100);
  function bail(){ if(window.__spArmed) return; clearInterval(window.__spTick); var s = $('splash'); if(s) s.remove(); }
  addEventListener('error', function(){ setTimeout(bail, 0); });
  addEventListener('load', function(){ setTimeout(bail, 0); });
  setTimeout(bail, 15000);
})();
</script>

<main>
  <!-- ============ HOME ============ -->
  <section class="tab" id="tab-home" data-title="tabToday">
    <div class="head anim">
      <div>
        <div class="eyebrow" id="homeDate"></div>
        <h1 class="large" id="homeTitle"></h1>
      </div>
      <div class="head-actions">
        <button class="help-btn press" id="helpBtn" data-i18n-aria="helpAria"><svg class="i"><use href="#i-circle-help"/></svg></button>
        <button class="chip-btn press" id="langBtn" aria-label="Language / ภาษา"><svg class="i"><use href="#i-globe"/></svg><span id="langBtnText">EN</span></button>
        <button class="mini-avatar press" id="miniAvatar" data-i18n-aria="tabProfile">?</button>
      </div>
    </div>

    <div class="hero anim" id="hero">
      <div class="hero-top">
        <span class="pill"><span class="dot"></span><span id="phaseText"></span></span>
        <span class="range" id="phaseRange"></span>
      </div>
      <!-- the fasting clock as a city: the moon (sun by day) travels the sky arc, each night of the month adds a building -->
      <div class="city" id="city">
        <svg class="city-svg" viewBox="0 0 320 220" aria-hidden="true">
          <defs>
            <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="sky-b"/><stop offset=".45" class="sky-a"/><stop offset="1" class="sky-b"/></linearGradient>
            <radialGradient id="gGlow"><stop offset="0" class="glow-a"/><stop offset="1" class="glow-b"/></radialGradient>
            <pattern id="gWin" width="4" height="5.5" patternUnits="userSpaceOnUse"><rect x="1" y="1.2" width="1.7" height="2.3" rx=".3" class="win"/></pattern>
            <pattern id="gWinB" width="4" height="5.5" patternUnits="userSpaceOnUse"><rect x="1" y="1.2" width="1.7" height="2.3" rx=".3" class="win b"/></pattern>
          </defs>
          <rect class="sky" x="0" y="0" width="320" height="220" fill="url(#gSky)"/>
          <g class="stars" id="cityStars"></g>
          <g class="clouds"><g class="cloud c1"><circle cx="40" cy="70" r="7"/><circle cx="50" cy="66" r="9"/><circle cx="60" cy="71" r="6"/><rect x="34" y="70" width="32" height="7" rx="3.5"/></g>
            <g class="cloud c2"><circle cx="230" cy="48" r="5"/><circle cx="238" cy="45" r="7"/><circle cx="246" cy="49" r="5"/><rect x="226" y="48" width="25" height="6" rx="3"/></g></g>
          <g id="cityFxBack"></g>
          <path class="arc-track" d="M25 172 A135 135 0 0 1 295 172"/>
          <path class="ring-arc arc-fill" id="ringArc" d="M25 172 A135 135 0 0 1 295 172" pathLength="1" stroke="url(#gArc)" stroke-dasharray="1" stroke-dashoffset="1"/>
          <g id="celestial" transform="translate(25 172)">
            <circle class="c-glow" r="30" fill="url(#gGlow)"/>
            <g class="c-sun"><circle r="10.5" fill="#ffc46b"/><circle r="10.5" fill="none" stroke="#ff9a3c" stroke-width="1.5"/></g>
            <g class="c-moon"><path d="M2.5 -11.5 a11.8 11.8 0 1 0 9.4 18.6 a9.2 9.2 0 1 1 -9.4 -18.6z" fill="#ffe9a8"/><circle cx="-4" cy="2" r="1.6" fill="#f2cf73" opacity=".7"/><circle cx="-1" cy="6.5" r="1.1" fill="#f2cf73" opacity=".7"/></g>
          </g>
          <g id="skyline"></g>
          <rect class="ground" x="0" y="211" width="320" height="9"/>
          <g id="cityRoad"></g>
          <g id="cityFxFront"></g>
        </svg>
        <div class="ring-center">
          <div class="lbl" id="heroLabel"></div>
          <div class="time num" id="heroTime">0:00:00</div>
          <div class="sub" id="heroSub"></div>
        </div>
      </div>
      <div class="river" id="river" hidden><svg viewBox="0 0 320 46" aria-hidden="true">
        <defs><linearGradient id="gRiver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2c50"/><stop offset="1" stop-color="#0c1326"/></linearGradient></defs>
        <rect width="320" height="46" fill="url(#gRiver)"/>
        <g class="moonref"><ellipse cx="262" cy="12" rx="11" ry="2.4"/><ellipse cx="260" cy="19" rx="7" ry="1.8"/><ellipse cx="264" cy="26" rx="4" ry="1.4"/></g>
        <path class="rip" d="M0 9 H320 M0 22 H320 M0 36 H320"/>
        <g id="riverKt"></g>
      </svg></div>
      <div class="city-cap" id="cityCap"></div>
      <div class="hero-metrics">
        <div><svg class="i"><use href="#i-sunset"/></svg><span class="k" data-i18n="lblClose"></span><span class="v num" id="mClose"></span></div>
        <div><svg class="i"><use href="#i-sunrise"/></svg><span class="k" data-i18n="lblBreak"></span><span class="v num" id="mBreak"></span></div>
        <div><svg class="i"><use href="#i-timer"/></svg><span class="k" data-i18n="lblGoal"></span><span class="v num" id="mGoal"></span></div>
      </div>
    </div>

    <button class="card fest-banner press anim" id="festBanner" hidden>
      <span class="fb-ic"><svg class="i"><use href="#i-lotus"/></svg></span>
      <span class="tx"><b id="fbTitle"></b><span id="fbSub"></span></span>
      <span class="lotus-pill"><svg class="i"><use href="#i-lotus"/></svg><span id="fbLotus">0</span></span>
    </button>
    <button class="cta press anim" id="sosBtn"><svg class="i"><use href="#i-shield-check"/></svg><span data-i18n="sosCta"></span></button>

    <div class="section anim"><h2 id="ciTitle"></h2><span class="aside" id="ciDate"></span></div>
    <div class="card anim" id="ciCard">
      <div class="seg" id="seg">
        <span class="thumb" id="segThumb"></span>
        <button data-s="ok" data-i18n="stOk"></button>
        <button data-s="light" data-i18n="stLight"></button>
        <button data-s="miss" data-i18n="stMiss"></button>
      </div>
      <div class="hint" id="ciNote"></div>
    </div>

    <div class="section anim"><h2 data-i18n="thisWeek"></h2><span class="aside" id="weekCount"></span></div>
    <div class="card week anim" id="week"></div>

    <div class="card stats3 anim" style="margin-top:12px">
      <div><div class="stat-ic"><svg class="i"><use href="#i-flame"/></svg></div><div class="label" data-i18n="streak"></div><div class="v num" id="stStreak"></div></div>
      <div><div class="stat-ic"><svg class="i"><use href="#i-piggy-bank"/></svg></div><div class="label" data-i18n="saved"></div><div class="v num" id="stSaved"></div></div>
      <div><div class="stat-ic"><svg class="i"><use href="#i-shield-check"/></svg></div><div class="label" data-i18n="resisted"></div><div class="v num" id="stFought"></div></div>
    </div>

    <button class="card rw-strip press anim" id="rwStrip"><span class="ic"><svg class="i"><use href="#i-gift"/></svg></span><span class="tx"><b data-i18n="rwStripTitle"></b><span id="rwStripText"></span></span><svg class="i"><use href="#i-chevron-right"/></svg></button>
  </section>

  <!-- ============ RUN (treadmill) ============ -->
  <section class="tab" id="tab-run" data-title="tabRun" hidden>
    <div class="anim">
      <div class="eyebrow" data-i18n="runEyebrow"></div>

    <div class="run-hero anim">
      <div class="k" data-i18n="runThisWeek"></div>

      <div class="sub" id="rwSub"></div>
      <div class="wbars" id="rwBars"></div>

    <button class="cta press anim" id="runCta"><svg class="i"><use href="#i-play"/></svg><span id="runCtaText"></span></button>

    <div class="section anim"><h2 data-i18n="runTotals"></h2></div>

      <div><div class="label" data-i18n="runHours"></div><div class="v num" id="rtHrs">0</div></div>
    </div>

    <div class="section anim"><h2 data-i18n="runActivities"></h2><span class="aside" id="runCountAside"></span></div>
    <div class="rfeed anim" id="runFeed"></div>
  </section>

  <!-- ============ REWARDS (quests + gacha) ============ -->
  <section class="tab" id="tab-rewards" data-title="tabRewards" hidden>
    <div class="anim">
      <div class="eyebrow" data-i18n="rwEyebrow"></div>
      <h1 class="large" data-i18n="tabRewards"></h1>
    </div>

    <div class="card wallet anim" id="wallet">

      <div><span class="label" data-i18n="shards"></span><span class="wv num star"><b>✦</b><span id="wShards">0</span></span><button class="ex-btn press" id="exBtn" data-i18n="exchange"></button></div>
    </div>
    <button class="card shop-banner press anim" id="shopBtn"><span class="ic"><svg class="i"><use href="#i-coins"/></svg></span><span class="tx"><b data-i18n="shopTitle"></b><span data-i18n="shopBanner"></span></span><span class="coin-pill"><svg class="i"><use href="#i-coins"/></svg><span id="wCoins">0</span></span></button>

        <button class="pull-btn gold press" id="pullGold" hidden><span data-i18n="pullGold"></span><small data-i18n="rateGoldShort"></small></button>
      </div>
    </div>

    <div class="section anim"><h2 data-i18n="questsTitle"></h2><span class="aside" id="questCount"></span></div>
    <div id="questList" class="anim"></div>

    <div class="section anim"><h2 data-i18n="collection"></h2><span class="aside" id="collCount"></span></div>
    <div class="card anim">
      <div class="tier-prog" id="tierProg"></div>
      <div class="coll-sets" id="collGrid"></div>

      <h1 class="large" data-i18n="tabProgress"></h1>

    <div class="card stats3 anim">
      <div><div class="label" data-i18n="thisMonth"></div><div class="v num" id="pmNights"></div></div>
      <div><div class="label" data-i18n="successRate"></div><div class="v num" id="pmRate"></div></div>
      <div><div class="label" data-i18n="saved"></div><div class="v num" id="pmSaved"></div></div>
    </div>

      <div class="chart-head">
        <div><div class="label" data-i18n="weeklyTitle"></div><div class="big num" id="weekAvg"></div></div>
        <div class="legend"><span><i style="background:var(--accent)"></i><span data-i18n="stOk"></span></span><span><i style="background:var(--light)"></i><span data-i18n="stLight"></span></span></div>

    <div class="card anim" style="margin-top:12px">

      <div class="cal" id="cal"></div>
    </div>

    <div class="section anim"><h2 data-i18n="recent"></h2></div>
    <div class="list anim" id="feed"></div>
  </section>

      <h1 class="large" data-i18n="tabProfile"></h1>
    </div>

    <div class="card profile-card anim">

    <div class="section anim"><h2 data-i18n="settings"></h2></div>

      <div class="row"><label data-i18n="language"></label>

      <div class="row"><label for="fBreak" data-i18n="fBreak"></label><input id="fBreak" type="time"></div>

      <div class="row"><label for="fWeight" data-i18n="fWeight"></label><input id="fWeight" type="number" inputmode="decimal" min="25" max="250" step="0.5"></div>
      <div class="row link" id="replayTour" role="button" tabindex="0"><span style="flex:1" data-i18n="replayTour"></span><svg class="i"><use href="#i-circle-help"/></svg></div>
    </div>
    <button class="danger press anim" id="resetAll" data-i18n="reset"></button>
    <p class="footnote anim" data-i18n="footnote"></p>
  </section>
</main>

<div class="rlive" id="runLive" role="dialog" aria-modal="true" data-i18n-aria="runLiveTitle">

      <div><span class="k" data-i18n="runDist"></span><b class="num"><span id="rlDist">0.00</span><small>km</small></b></div>
      <div><span class="k" data-i18n="runPace"></span><b class="num"><span id="rlPace">–:––</span><small>/km</small></b></div>

    </div>

    </div>
    <div class="rl-ctl">
      <div class="rl-ctl-head"><span><svg class="i"><use href="#i-trending-up"/></svg><span data-i18n="runIncline"></span></span><span>%</span></div>
      <div class="rl-step">
        <button type="button" data-adj="incline" data-d="-0.5" data-i18n-aria="runLower"><svg class="i"><use href="#i-minus"/></svg></button>
        <b class="num" id="rlInc">0.0</b>
        <button type="button" data-adj="incline" data-d="0.5" data-i18n-aria="runHigher"><svg class="i"><use href="#i-plus"/></svg></button>
      </div>
      <div class="rl-chips" id="rlIncChips"></div>
    </div>
    <div class="rl-btns">
      <button class="rl-pause press" id="rlPause"><svg class="i"><use href="#i-pause"/></svg><span data-i18n="runPause"></span></button>
      <button class="rl-finish press" id="rlFinish"><svg class="i"><use href="#i-square"/></svg><span data-i18n="runFinish"></span></button>
      <button class="rl-resume press" id="rlResume"><svg class="i"><use href="#i-play"/></svg><span data-i18n="runResume"></span></button>
    </div>
    <div class="rl-count" id="rlCount" aria-live="assertive"></div>
  </div>
  <div class="rl-sum" id="rlSum">
    <div class="ok"><svg class="i"><use href="#i-trophy"/></svg></div>
    <h2 data-i18n="runDoneTitle"></h2>
    <p data-i18n="runDoneSub"></p>
    <div class="rl-form">
      <label><span data-i18n="runDist"></span><input id="rsDist" type="number" inputmode="decimal" min="0" step="0.01"><small>km</small></label>
      <label><span data-i18n="runTime"></span><input id="rsTime" inputmode="numeric" placeholder="mm:ss" autocomplete="off"><small></small></label>
      <label><span data-i18n="runKcal"></span><input id="rsKcal" type="number" inputmode="numeric" min="0" step="1"><small>kcal</small></label>
    </div>
    <div class="stats3">
      <div><div class="label" data-i18n="runAvgPace"></div><div class="v num" id="rsPace">–:––</div></div>
      <div><div class="label" data-i18n="runElev"></div><div class="v num" id="rsElev">0</div></div>
      <div><div class="label">XP</div><div class="v num" id="rsXP">+0</div></div>
    </div>
    <div class="feel-k" data-i18n="runFeel"></div>
    <div class="feel" id="rsFeel"></div>
    <button class="finish press" id="rsSave" data-i18n="runSave"></button>
    <button class="rl-discard press" id="rsDiscard" data-i18n="runDiscard"></button>
  </div>
</div>
